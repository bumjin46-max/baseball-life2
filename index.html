<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1a15">
<title>야구 인생 — 한 선수의 기록</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1a15; --turf:#14261f; --turf2:#1b332a;
  --clay:#c07a45; --chalk:#eceadf; --chalk-dim:#9aa79f; --lamp:#f5c451;
  --red:#d2604f; --green:#8fd6a6; --blue:#6f9fc4; --purple:#b58ad6;
  --line:rgba(236,234,223,.14); --line2:rgba(236,234,223,.26);
  /* 전체 기본 폰트 — 한 곳에서 교체 가능 */
  --font:'NanumSquare','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --digit:'Bebas Neue','NanumSquare',sans-serif;   /* 전광판 숫자 전용 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 600px at 50% -10%,#1d3a2e 0%,transparent 60%),var(--night);
  color:var(--chalk); font-family:var(--font); font-size:15px; line-height:1.65;
  min-height:100vh; word-break:keep-all;
}
h1,h2,h3,h4{font-family:var(--font);font-weight:800;letter-spacing:-.02em;margin:0}
.num{font-family:var(--digit);letter-spacing:.04em;color:var(--lamp);font-weight:400}
button{font-family:var(--font);font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.dim{color:var(--chalk-dim)} .sm{font-size:12.5px} .center{text-align:center}
.up{color:var(--green)} .down{color:var(--red)}

/* ── 레이아웃 ── */
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
.stage{display:grid;grid-template-columns:238px minmax(0,1fr) 232px;gap:16px;align-items:start}

/* ── 상단 전광판 ── */
.board{border:1px solid var(--line);background:linear-gradient(180deg,#152720,#0f1c18);
  padding:11px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center}
.board .who{font-size:20px;font-weight:800;margin-right:2px}
.board .nick{font-size:12px;color:var(--clay);margin-right:6px}
.board .bit{font-size:12.5px;color:var(--chalk-dim)}
.board .bit b{font-family:var(--digit);font-size:18px;color:var(--lamp);font-weight:400;margin-left:5px;vertical-align:-1px}
.cond{margin-left:auto;font-size:12px;padding:3px 11px;border:1px solid var(--line2);border-radius:999px}
.cond.c4{color:var(--green);border-color:rgba(143,214,166,.5)}
.cond.c0,.cond.c1{color:var(--red);border-color:rgba(210,96,79,.5)}

/* ── 패널 ── */
.panel{border:1px solid var(--line);background:rgba(20,38,31,.55);padding:14px}
.panel+.panel{margin-top:12px}
.panel h3{margin:0 0 10px;font-size:12px;color:var(--chalk-dim);font-weight:700;letter-spacing:.08em}
.grp{font-size:11px;color:var(--clay);font-weight:700;letter-spacing:.08em;margin:12px 0 6px}
.grp:first-child{margin-top:0}

/* ── 능력치 바 ── */
.stat{margin-bottom:8px}
.stat .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:3px}
.stat .row .v{font-family:var(--digit);font-size:17px;color:var(--chalk)}
.bar{height:7px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--clay),var(--lamp));
  display:block;transition:width .55s cubic-bezier(.2,.8,.3,1)}
.bar i.hi{background:linear-gradient(90deg,#8fd6a6,#dff5a0)}
.bar i.lo{background:linear-gradient(90deg,#6d5340,#9a7550)}
.bar .gain{position:absolute;top:0;bottom:0;background:rgba(143,214,166,.55);animation:flash 1.2s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:.25}}

/* ── 특성 카드 ── */
.traits{display:grid;gap:8px}
.tcard{border:1px solid var(--line);padding:9px 10px;position:relative;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent)}
.tcard .tn{font-weight:800;font-size:14.5px;line-height:1.3}
.tcard .td{font-size:11.5px;color:var(--chalk-dim);line-height:1.45;margin-top:2px}
.tcard .gr{position:absolute;top:8px;right:9px;font-size:10px;letter-spacing:.06em;font-weight:700}
.tcard.empty{border-style:dashed;opacity:.3;text-align:center;font-size:12px;padding:11px}
.g일반{color:#9aa79f}.g희귀{color:var(--blue)}.g영웅{color:var(--purple)}.g전설{color:var(--lamp)}.g신화{color:var(--red)}
.tcard.b일반{border-left:3px solid #9aa79f}.tcard.b희귀{border-left:3px solid var(--blue)}
.tcard.b영웅{border-left:3px solid var(--purple)}.tcard.b전설{border-left:3px solid var(--lamp)}
.tcard.b신화{border-left:3px solid var(--red)}
.tcard.neg{background:linear-gradient(180deg,rgba(210,96,79,.09),transparent)}

/* ── 중앙 씬 ── */
.scene{border:1px solid var(--line);background:linear-gradient(180deg,rgba(27,51,42,.72),rgba(15,28,24,.72));
  padding:24px 24px 20px;min-height:360px;display:flex;flex-direction:column;border-radius:3px}
.scene .when{font-size:12px;color:var(--clay);margin-bottom:9px;font-weight:700;letter-spacing:.04em}
.scene h2{font-size:25px;margin-bottom:13px;line-height:1.35}
.scene .body{font-size:15.5px;line-height:1.9;white-space:pre-wrap;flex:1}
.scene .body em{color:var(--lamp);font-style:normal;font-weight:700}
.choices{display:grid;gap:9px;margin-top:20px}
.choice{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);
  padding:13px 14px;border-radius:3px;transition:background .12s,border-color .12s}
.choice:hover{background:rgba(245,196,81,.09);border-color:rgba(245,196,81,.45)}
.choice .ct{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.choice .cs{font-size:12.5px;color:var(--chalk-dim);margin-top:4px}
.rb{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:.04em}
.rb.SAFE{background:rgba(143,214,166,.16);color:var(--green)}
.rb.BALANCED{background:rgba(111,159,196,.16);color:var(--blue)}
.rb.RISK{background:rgba(245,196,81,.16);color:var(--lamp)}
.rb.HIGH_RISK{background:rgba(210,96,79,.18);color:var(--red)}
.odds{margin-top:6px;display:grid;gap:3px;font-size:12.5px}
.odds div{display:flex;gap:9px;align-items:baseline}
.odds b{font-family:var(--digit);font-size:15px;color:var(--lamp);font-weight:400;min-width:38px;text-align:right}
.go{background:var(--clay);border:none;color:#1a0f07;font-weight:800;padding:13px 28px;
  margin-top:18px;align-self:flex-start;border-radius:3px}
.go:hover{background:var(--lamp)}
.ghost{background:transparent;border:1px solid var(--line);padding:11px 18px;border-radius:3px}
.ghost:hover{border-color:var(--lamp)}

/* ── 결과 로그 / 변화량 ── */
.log{margin-top:14px;font-size:13.5px;border-left:2px solid var(--clay);padding:3px 0 3px 13px;display:grid;gap:7px;color:#cfd6d0}
.diffbox{margin-top:14px;border:1px solid var(--line);border-radius:3px;padding:11px 13px;background:rgba(0,0,0,.18)}
.diffbox h4{font-size:11px;color:var(--chalk-dim);letter-spacing:.08em;margin-bottom:8px}
.dline{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}
.dline .nm{min-width:54px;color:var(--chalk-dim)}
.dline .from{font-family:var(--digit);font-size:16px;color:var(--chalk-dim)}
.dline .to{font-family:var(--digit);font-size:18px}
.dline .delta{font-weight:800;font-size:12.5px;padding:1px 7px;border-radius:2px}
.dline.plus .to{color:var(--green)} .dline.plus .delta{background:rgba(143,214,166,.16);color:var(--green)}
.dline.minus .to{color:var(--red)} .dline.minus .delta{background:rgba(210,96,79,.16);color:var(--red)}
.dline .mini{flex:1;height:5px;background:rgba(255,255,255,.07);position:relative;border-radius:2px;min-width:40px;overflow:hidden}
.dline .mini i{position:absolute;inset:0 auto 0 0;background:var(--clay);transition:width .6s}
.dline .mini u{position:absolute;top:0;bottom:0;background:var(--green);text-decoration:none}

/* ── 카드류 ── */
.pcard{border:1px solid var(--line2);border-radius:4px;padding:18px 16px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.18))}
.pcard .pos{font-size:11px;letter-spacing:.14em;color:var(--clay);font-weight:800}
.pcard .pn{font-size:24px;font-weight:800;margin:8px 0 2px}
.pcard .pm{font-size:12.5px;color:var(--chalk-dim)}
.pcard .ball{font-size:30px;line-height:1;margin-bottom:6px}
.seasoncard{border:1px solid var(--line2);border-radius:4px;padding:22px;text-align:center;
  background:linear-gradient(180deg,rgba(245,196,81,.08),transparent);margin-bottom:6px}
.seasoncard .yy{font-family:var(--digit);font-size:52px;color:var(--lamp);line-height:1}
.newscard{border:1px solid var(--line);border-left:3px solid var(--clay);border-radius:2px;
  padding:9px 12px;margin-bottom:7px;background:rgba(255,255,255,.025)}
.newscard .nh{font-size:10px;letter-spacing:.14em;color:var(--clay);font-weight:800}
.newscard .nb{font-size:13.5px;margin-top:2px;line-height:1.5}
.newscard.me{border-left-color:var(--lamp);background:rgba(245,196,81,.07)}

/* 특성 획득 연출 */
.reveal{text-align:center;padding:16px 0}
.reveal .lab{font-size:11px;letter-spacing:.24em;color:var(--clay);font-weight:800}
.reveal .ico{font-size:40px;margin:14px 0 6px;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.reveal .tn2{font-size:30px;font-weight:800;margin-bottom:6px}
.reveal .stars{letter-spacing:.2em;font-size:13px}
.reveal .desc{margin-top:12px;font-size:14px;color:var(--chalk-dim)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* ── 표 ── */
table.rec{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.rec th{text-align:right;font-weight:700;color:var(--chalk-dim);font-size:11px;padding:6px;border-bottom:1px solid var(--line)}
table.rec th:first-child{text-align:left}
table.rec td{text-align:right;padding:6px;border-bottom:1px solid rgba(236,234,223,.06);font-family:var(--digit);font-size:16px}
table.rec td:first-child{text-align:left;font-family:var(--font);font-size:13px}
tr.mine td{color:var(--lamp);background:rgba(245,196,81,.07)}
.tabs{display:flex;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-bottom:none;padding:8px 13px;
  font-size:13px;color:var(--chalk-dim);font-weight:700}
.tab.on{color:var(--lamp);border-color:var(--lamp);background:rgba(245,196,81,.08)}

/* 커리어 그래프 */
.spark{width:100%;height:120px;display:block}
.spark .ln{fill:none;stroke:var(--lamp);stroke-width:2}
.spark .dot{fill:var(--lamp)}
.spark .ax{stroke:var(--line);stroke-width:1}
.spark text{font-family:var(--digit);font-size:11px;fill:var(--chalk-dim)}

/* 타임라인 */
.tl{display:grid;gap:0;font-size:13.5px}
.tl div{display:flex;gap:12px;align-items:flex-start;padding:5px 0;position:relative}
.tl b{font-family:var(--digit);color:var(--clay);font-weight:400;font-size:16px;min-width:40px}
.tlx{border-left:1px solid var(--line);margin-left:6px;padding-left:16px}
.tlx div{position:relative}
.tlx div::before{content:'';position:absolute;left:-21px;top:12px;width:7px;height:7px;
  border-radius:50%;background:var(--clay)}

/* ── 타이틀 / 명예의 전당 / 엔딩 ── */
.title{max-width:640px;margin:5vh auto;text-align:center}
.title .kicker{font-size:12px;color:var(--clay);margin-bottom:12px;letter-spacing:.1em;font-weight:800}
.title h1{font-size:clamp(36px,9vw,58px);line-height:1.1}
.title .ball{font-size:40px;display:block;margin-bottom:8px}
.title .sub{color:var(--chalk-dim);margin:14px auto 30px;max-width:420px;font-size:14.5px}
.menu{display:grid;gap:10px;max-width:330px;margin:0 auto}
.menu button{padding:15px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-weight:700;border-radius:3px}
.menu button:hover{border-color:var(--lamp);color:var(--lamp)}
.menu button[disabled]{opacity:.3;cursor:not-allowed}
.field{display:flex;gap:8px}
.field input{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--chalk);
  padding:12px;font-family:var(--font);font-size:18px;font-weight:800;border-radius:3px}

.ending{max-width:660px;margin:0 auto;text-align:center;border:1px solid var(--line);
  padding:30px 24px;background:linear-gradient(180deg,rgba(27,51,42,.7),rgba(13,26,21,.92))}
.ending .nm{font-size:38px;font-weight:800;margin:4px 0}
.ending .yr{color:var(--chalk-dim);font-size:13px;letter-spacing:.14em}
.rule{height:1px;background:var(--line);margin:20px 0}
.bigline{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:16px 0}
.bigline div{text-align:center}
.bigline .n{font-family:var(--digit);font-size:31px;color:var(--lamp);line-height:1}
.bigline .l{font-size:11.5px;color:var(--chalk-dim)}
.verdict{font-size:27px;font-weight:800;color:var(--lamp);margin:6px 0 10px}
.quote{font-size:15.5px;line-height:1.95;color:#dfe4dd}
.gradebox{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--lamp);
  padding:8px 18px;border-radius:3px;background:rgba(245,196,81,.08)}
.gradebox .g{font-family:var(--digit);font-size:40px;color:var(--lamp);line-height:1}
.pill{display:inline-block;font-size:11.5px;border:1px solid var(--line2);padding:2px 9px;
  border-radius:999px;color:var(--chalk-dim);margin:0 4px 5px 0}
.pill.hi{color:var(--lamp);border-color:rgba(245,196,81,.5)}
.hofrow{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}
.hofrow .rk{font-family:var(--digit);font-size:23px;color:var(--clay);min-width:32px}
.hofrow .nm{font-size:16px;font-weight:800;min-width:76px}
.hofrow.top1 .rk,.hofrow.top1 .nm{color:var(--lamp)}

/* ── 모바일 ── */
.navbar{display:none}
@media(max-width:940px){
  .wrap{padding:10px 11px calc(72px + env(safe-area-inset-bottom))}
  .stage{grid-template-columns:1fr;gap:12px}
  .side{display:none}
  .side.show{display:block}
  .board{position:sticky;top:0;z-index:30;padding:9px 12px;margin:-10px -11px 12px;
    background:linear-gradient(180deg,#16281f,#101d19);border-left:none;border-right:none;border-top:none}
  .board .who{font-size:17px}
  .scene{padding:18px 15px 16px;min-height:auto}
  .scene h2{font-size:21px}
  .scene .body{font-size:15.5px}
  .choice{padding:15px 14px;min-height:60px}
  .choice .ct{font-size:16px}
  .go{width:100%;text-align:center;padding:16px;font-size:16px;align-self:stretch}
  .ghost,.tab{min-height:44px}
  .menu button{padding:17px;font-size:16px;min-height:56px}
  .panel{padding:12px}
  table.rec{display:block;overflow-x:auto;white-space:nowrap}
  .traits{grid-template-columns:1fr 1fr}
  .tcard.empty{display:none}
  .ending{padding:22px 14px}
  .ending .nm{font-size:30px}
  input,button,select,textarea{font-size:16px}
  /* 하단 네비게이션 */
  .navbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:#101d19;border-top:1px solid var(--line2);
    padding-bottom:env(safe-area-inset-bottom)}
  .navbar button{flex:1;background:none;border:none;padding:10px 2px 9px;font-size:11px;
    color:var(--chalk-dim);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;font-weight:700}
  .navbar button .ni{font-size:17px;line-height:1}
  .navbar button.on{color:var(--lamp)}
  .tabs{display:none}
}
@media(max-width:400px){ .traits{grid-template-columns:1fr} .board .bit{font-size:11.5px} }
@media(hover:none){
  .choice:hover{background:rgba(255,255,255,.03);border-color:var(--line)}
  .choice:active{background:rgba(245,196,81,.16);border-color:var(--lamp)}
}
@media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
@media(prefers-reduced-motion:no-preference){
  .scene,.panel{animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="navbar" id="nav"></div>
<script>
"use strict";
/* ==========================================================================
   [1] UTIL — 난수, 저장소
   ========================================================================== */
const R = {
  f:(a,b)=>a+Math.random()*(b-a),
  i:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  c:p=>Math.random()<p,
  pick:a=>a[Math.floor(Math.random()*a.length)],
  norm:(m,s)=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
    return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);},
  shuffle:a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const round=(v,d)=>Math.round(v*10**d)/10**d;
const avg3=v=>v.toFixed(3).replace(/^0/,'');

const MEM={};
const Store={
  async get(k){ try{const r=await window.storage.get(k);return r?JSON.parse(r.value):(MEM[k]??null);}catch(e){return MEM[k]??null;} },
  async set(k,v){ MEM[k]=v; try{await window.storage.set(k,JSON.stringify(v));}catch(e){} },
  async del(k){ delete MEM[k]; try{await window.storage.delete(k);}catch(e){} }
};

/* ==========================================================================
   [2] DATA — 구단
   ========================================================================== */
const TEAMS=[
  {id:'seoul', name:'서울 블루스',   short:'서울', money:5, dev:3, pdev:3, fan:5, star:5, power:4, tag:'자금력과 팬덤이 리그 최고. 대신 자리 경쟁이 치열하다.'},
  {id:'busan', name:'부산 웨일스',   short:'부산', money:3, dev:3, pdev:2, fan:5, star:3, power:3, tag:'열성 팬덤. 성적이 나쁘면 여론도 험하다.'},
  {id:'incheon',name:'인천 마리너스', short:'인천', money:4, dev:2, pdev:4, fan:3, star:4, power:4, tag:'투수 육성의 명가.'},
  {id:'daejeon',name:'대전 파이오니어스',short:'대전',money:2,dev:5,pdev:3,fan:3,star:2,power:2, tag:'유망주에게 기회를 아끼지 않는다.'},

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let SRND=Math.random;
const SR={
  f:(a,b)=>a+SRND()*(b-a), i:(a,b)=>Math.floor(a+SRND()*(b-a+1)),
  c:p=>SRND()<p, pick:a=>a[Math.floor(SRND()*a.length)],
  norm:(m,s)=>{let u=0,v=0;while(!u)u=SRND();while(!v)v=SRND();
    return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);},
  shuffle:a=>a.map(v=>[SRND(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])
};
function seedWorld(seed){SRND=mulberry32(seed>>>0);}

function aiStats(pos,target,style){
  const st={};
  POS[pos].keys.forEach(k=>st[k]=clamp(Math.round(SR.norm(target,6)+(style[k]||0)),18,99));
  let cur=ovrOf(pos,st),t=0;
  while(Math.abs(cur-target)>1&&t++<25){
    const d=(target-cur)*.9;
    POS[pos].keys.forEach(k=>st[k]=clamp(Math.round(st[k]+d),18,99));
    cur=ovrOf(pos,st);
  }
  return st;
}

function genAi(teamId,pos,age,year,tier,used){

  else if(age<=25)target=SR.norm(tier==='top'?66:56,6);
  else if(age<=31)target=SR.norm(tier==='top'?75:62,7);

/* ── 보직 배정 / 콜업·강등 ── */
function assignRoles(){
  const NEED={batter:11,catcher:3,pitcher:13}, ONE={batter:8,catcher:2,pitcher:10};
  TEAMS.forEach(t=>{
    ['batter','catcher','pitcher'].forEach(pos=>{
      let have=roster(t.id).filter(a=>a.pos===pos);
      while(have.length<NEED[pos]){                       // 인원 부족 → 육성선수 보충
        const a=genAi(t.id,pos,R.i(19,24),L.year,'std',null);
        a.lv='2군';L.players.push(a);have.push(a);
      }
      const arr=have.sort((a,b)=>(b.ovr+(b.lv==='1군'?1.5:0))-(a.ovr+(a.lv==='1군'?1.5:0)));
      arr.forEach((a,i)=>{
        const up=i<ONE[pos];
        if(up&&a.lv!=='1군'&&!a.debut)a.debut=L.year;
        a.lv=up?'1군':'2군';
      });
    });
    const r=roster(t.id);
    const bats=r.filter(a=>a.lv==='1군'&&a.pos!=='pitcher').sort((a,b)=>b.ovr-a.ovr);
    bats.forEach((a,i)=>a.role=i<8?'주전':'백업');
    const pit=r.filter(a=>a.lv==='1군'&&a.pos==='pitcher').sort((a,b)=>b.ovr-a.ovr);
    pit.forEach((a,i)=>a.role=i<5?'선발':'불펜');
    r.filter(a=>a.lv==='2군').forEach(a=>a.role='2군');
  });
}
function teamRating(tid,playerWar){
  const r=firstTeam(tid);
  const bats=r.filter(a=>a.pos!=='pitcher').sort((x,y)=>y.ovr-x.ovr).slice(0,9);
  const sp=r.filter(a=>a.pos==='pitcher'&&a.role==='선발').slice(0,5);
  const rp=r.filter(a=>a.pos==='pitcher'&&a.role==='불펜').slice(0,5);
  const m=a=>a.length?a.reduce((s,x)=>s+x.ovr,0)/a.length:50;
  let v=m(bats)*.44+m(sp)*.40+m(rp)*.16;
  if(playerWar)v+=playerWar*1.1;
  return v;
}

function aiBatSeason(a,teamStr){
  const s=blankLine();
  const gm=Math.round((a.role==='주전'?144:a.role==='백업'?74:26)*(a.pos==='catcher'?.88:1)*R.f(.78,1.0));
  const pa=Math.round(gm*(a.role==='주전'?4.3:3.5));
  const C=a.st.contact,P=a.st.power,E=a.st.eye;
  const avg=clamp(.140+C*.0019+E*.0002+R.norm(0,.021),.130,.400);
  const bb=Math.round(pa*clamp((E/100)*.135,.02,.22));
  const so=Math.round(pa*clamp(.245-C*.0012+P*.0008,.06,.36));
  const abn=Math.max(1,pa-bb-Math.round(pa*.02));
  const h=Math.round(abn*avg), hr=Math.round(pa*Math.pow(P/100,3.2)*.070);
  const d2=Math.round(h*(.15+P*.0009));
  const rn=a.st.run||38, sp=a.st.speed||38;
  const sb=Math.round(Math.pow(rn/100,2)*gm*.6*(.58+sp*.003));
  s.g=gm;s.pa=pa;s.ab=abn;s.h=Math.min(h,abn);s.hr=hr;s.d2=d2;s.bb=bb;s.so=so;s.sb=Math.max(0,sb);
  s.rbi=Math.round(hr*2.15+h*.33+(teamStr-62)*.35);
  s.avg=s.h/s.ab;
  const obp=(s.h+s.bb)/pa, slg=(s.h+s.d2+2*s.hr)/s.ab;
  s.ops=round(obp+slg,3);
  let def=((a.st.defense-58)/100)*1.6*(gm/144);
  if(a.pos==='catcher')def+=1.2*(gm/144)+((a.st.lead-55)/100)*1.4;
  s.war=round(clamp((gm/144)*((s.ops-.660)*15)+def+s.sb*.012,-2,9),1);
  return s;
}
function aiPitSeason(a,teamStr){
  const s=blankLine();
  const starter=a.role==='선발';
  const app=Math.round((starter?30:a.role==='불펜'?55:12)*R.f(.72,1.0));
  const per=starter?(4.3+a.st.stamina*.028):(a.role==='불펜'?1.5:3.4);
  const ip=round(app*per,1);
  const rate=a.st.stuff*.34+a.st.control*.30+a.st.velo*.16+a.st.breaking*.20;
  const era=clamp(round(9.9-rate*.078+R.norm(0,.55)-(a.st.crisis-50)*.006,2),1.30,9.5);
  const k9=clamp(2.5+(a.st.velo-45)*.085+(a.st.stuff-45)*.06+a.st.breaking*.018,3,15);
  const dec=Math.round(app*(starter?.68:.26));
  const wr=clamp(.44+(4.70-era)*.075+(teamStr-62)*.006,.18,.80);
  s.g=app;s.ip=ip;s.w=Math.round(dec*wr);s.l=Math.max(0,dec-s.w);
  s.sv=starter?0:Math.round(app*R.f(0,.35));
  s.k=Math.round(ip/9*k9);s.er=Math.round(ip/9*era);s.era=era;
  s.war=round(clamp((ip/9)*((5.00-era)*.135)+s.sv*.06,-2,9),1);
  return s;
}
function aiSeasonAll(){
  const ratings={};
  TEAMS.forEach(t=>ratings[t.id]=teamRating(t.id));
  L.players.forEach(a=>{
    if(a.retired){a.s=blankLine();return;}
    if(a.lv==='2군'){a.s=blankLine();return;}
    if(!a.debut)a.debut=L.year;
    a.s=a.pos==='pitcher'?aiPitSeason(a,ratings[a.team]):aiBatSeason(a,ratings[a.team]);
    if(R.c(.13)){ const k=R.f(.35,.7);   // 부상·부진 시즌
      ['g','pa','ab','h','hr','rbi','sb','bb','so','ip','w','l','k','er'].forEach(f=>a.s[f]=Math.round(a.s[f]*k));
      a.s.war=round(a.s.war*k,1); }
    const c=a.c,s=a.s;
    c.g+=s.g;c.ab+=s.ab;c.h+=s.h;c.hr+=s.hr;c.rbi+=s.rbi;c.sb+=s.sb;c.bb+=s.bb;
    c.ip=round(c.ip+s.ip,1);c.w+=s.w;c.l+=s.l;c.sv+=s.sv;c.k+=s.k;c.er+=s.er;
    c.war=round(c.war+s.war,1);
    if(s.war>a.peak){a.peak=s.war;a.peakY=L.year;}
    if(a.flagRival||s.war>=5)a.lines.push({y:L.year,t:a.team,g:s.g,h:s.h,hr:s.hr,rbi:s.rbi,
      sb:s.sb,avg:round(s.avg,3),ip:s.ip,w:s.w,era:s.era,k:s.k,war:s.war});
  });
  return ratings;
}
/* ── 순위 ── */
function simStandings(playerWar){
  const ratings={};
  TEAMS.forEach(t=>ratings[t.id]=teamRating(t.id,t.id===G.p.team?playerWar:0));
  const mean=TEAMS.reduce((s,t)=>s+ratings[t.id],0)/TEAMS.length;
  let rows=TEAMS.map(t=>({id:t.id,rating:round(ratings[t.id],1),
    w:clamp(Math.round(72+(ratings[t.id]-mean)*2.2+R.norm(0,5.5)),42,102)}));
  const tot=rows.reduce((s,r)=>s+r.w,0), adj=(720-tot)/rows.length;
  rows.forEach(r=>{r.w=clamp(Math.round(r.w+adj),42,102);r.l=144-r.w;});
  rows.sort((a,b)=>b.w-a.w||b.rating-a.rating);
  rows.forEach((r,i)=>r.rank=i+1);
  L.standings=rows;
  return rows;
}
function postseasonRun(){
  const top=L.standings.slice(0,5);
  let field=top.map(r=>({id:r.id,rating:r.rating,rank:r.rank}));
  // 준플레이오프 → 플레이오프 → 한국시리즈 (상위 시드 어드밴티지)
  const beat=(a,b,edge)=>{const p=clamp(.5+(a.rating-b.rating)*.035+edge,.1,.9);return R.c(p)?a:b;};
  let x=beat(field[3],field[4],.06);
  x=beat(field[2],x,.10);
  x=beat(field[1],x,.12);
  const champ=beat(field[0],x,.14);
  return {champ:champ.id,runnerUp:(champ.id===field[0].id?x.id:field[0].id)};
}
/* ── 시상 ── */
function leagueAwards(playerEntry){
  const ents=L.players.filter(a=>!a.retired&&a.lv==='1군').map(a=>({a,s:a.s,name:a.name,pos:a.pos,
    team:a.team,rookie:a.debut===L.year,ai:1}));
  if(playerEntry)ents.push(playerEntry);
  const bats=ents.filter(e=>e.pos!=='pitcher'), pits=ents.filter(e=>e.pos==='pitcher');
  const best=(arr,f,min)=>arr.filter(e=>min?min(e):true).sort((x,y)=>f(y)-f(x))[0];
  const lead={
    hr:best(bats,e=>e.s.hr), hit:best(bats,e=>e.s.h),
    avg:best(bats,e=>e.s.avg,e=>e.s.ab>=250), rbi:best(bats,e=>e.s.rbi), sb:best(bats,e=>e.s.sb),
    win:best(pits,e=>e.s.w), so:best(pits,e=>e.s.k),
    era:best(pits,e=>-e.s.era,e=>e.s.ip>=100),
    mvp:best(ents,e=>e.s.war),
    rookie:best(ents.filter(e=>e.rookie),e=>e.s.war)
  };
  // 올스타 / 골든글러브
  const allstars=ents.filter(e=>e.s.war>=3.0).sort((x,y)=>y.s.war-x.s.war).slice(0,24);
  const gg={};
  ['batter','pitcher','catcher'].forEach(pos=>{
    const c=ents.filter(e=>e.pos===pos).sort((x,y)=>y.s.war-x.s.war)[0];
    if(c)gg[pos]=c;
  });
  // AI 수상 반영
  const bump=(e,k)=>{if(e&&e.ai)e.a.aw[k]++;};
  bump(lead.hr,'hr');bump(lead.hit,'hit');bump(lead.avg,'hit');bump(lead.sb,'sb');
  bump(lead.win,'win');bump(lead.so,'so');bump(lead.era,'era');
  bump(lead.mvp,'mvp');bump(lead.rookie,'rookie');
  allstars.forEach(e=>{if(e.ai)e.a.aw.allstar++;});
  Object.values(gg).forEach(e=>{if(e.ai)e.a.aw.gg++;});
  lead.allstars=allstars;lead.gg=gg;lead.ents=ents;
  return lead;
}
/* ── 리그 기록 갱신 ── */
function updateRecords(entries){
  const S=L.rec.season,C=L.rec.career;
  const chk=(k,name,v,year,extra)=>{if(!S[k]||v>S[k].v)S[k]={v:round(v,3),name,y:year,extra};};
  entries.forEach(e=>{
    const s=e.s;
    if(e.pos==='pitcher'){
      chk('w',e.name,s.w,L.year);chk('k',e.name,s.k,L.year);
      if(s.ip>=100&&(!S.era||s.era<S.era.v))S.era={v:s.era,name:e.name,y:L.year};
    }else{
      chk('hr',e.name,s.hr,L.year);chk('h',e.name,s.h,L.year);chk('rbi',e.name,s.rbi,L.year);
      chk('sb',e.name,s.sb,L.year);
      if(s.ab>=250)chk('avg',e.name,s.avg,L.year);
    }
    chk('war',e.name,s.war,L.year);
  });
  const all=[...L.players,...L.retired];
  const ckey=(k,f,min)=>{let b=null;all.forEach(a=>{const v=f(a);if(v!=null&&(!b||v>b.v))b={v:round(v,1),name:a.name};});
    if(G.p){const v=f(playerCareerObj());if(v!=null&&(!b||v>b.v))b={v:round(v,1),name:G.p.name,me:1};}
    C[k]=b;};
  ckey('hr',a=>a.c?a.c.hr:null);ckey('h',a=>a.c?a.c.h:null);ckey('w',a=>a.c?a.c.w:null);
  ckey('k',a=>a.c?a.c.k:null);ckey('war',a=>a.c?a.c.war:null);
}
function playerCareerObj(){const p=G.p;return {c:{hr:p.tot.hr,h:p.tot.h,w:p.tot.w,k:p.tot.k,war:p.tot.war}};}

/* ==========================================================================
   [21] ENGINE — 성장 / 은퇴 / 신인 / 트레이드 / FA (developmentEngine)
   ========================================================================== */
function aiDevelop(a){
  const age=a.age;
  const rate=age<=22?.20:age<=26?.13:age<=29?.06:.01;
  const dev=CUL(a.team).youth*.02;
  POS[a.pos].keys.forEach(k=>{
    let g=(a.pot-a.st[k])*rate*(1+dev)*R.f(.5,1.5);
    if(age>=30){
      const phys=a.pos==='pitcher'?['velo','stamina','recovery']:['speed','run','stamina','defense'];
      g-=phys.includes(k)?(age>=35?R.f(2.0,3.8):age>=33?R.f(1.2,2.6):R.f(.6,1.6))
                         :(age>=34?R.f(.5,1.6):age>=32?R.f(.2,.9):0);
    }
    a.st[k]=clamp(round(a.st[k]+g,1),12,99);
  });
  a.ovr=ovrOf(a.pos,a.st);
  a.age++;
}
function aiRetire(a){
  if(a.age>=41)return true;
  if(a.age>=38&&R.c(.45))return true;
  if(a.age>=36&&a.ovr<68)return true;
  if(a.age>=34&&a.ovr<60)return true;
  if(a.age>=32&&a.ovr<50)return true;
  if(a.age>=27&&a.ovr<42)return true;          // 성장 실패 → 방출
  if(a.lv==='2군'&&a.age>=27&&a.ovr<50)return true;
  return false;
}
function genRookies(year,used){
  const out=[];
  TEAMS.forEach(t=>{
    const n=SR.i(2,3)+(CUL(t.id).youth>=4?1:0);
    for(let i=0;i<n;i++){
      const pos=SR.c(.45)?'batter':SR.c(.75)?'pitcher':'catcher';
      const tier=SR.c(.12)?'top':'std';
      const a=genAi(t.id,pos,SR.i(18,21),year,tier,used);
      a.lv='2군';a.rookieYear=year;
      out.push(a);
    }
  });
  return out;
}
function aiOffseason(){
  seedWorld((L.seed+L.year*7919)>>>0);
  const used=new Set(L.players.map(a=>a.name));
  const notes=[];
  // 은퇴
  L.players.filter(a=>!a.retired).forEach(a=>{
    if(aiRetire(a)){
      a.retired=true;a.retireYear=L.year;
      if(a.c.war>=20||a.flagRival){
        L.retired.push(a);
        if(a.c.war>=25)notes.push(`${a.name} 은퇴 (통산 WAR ${a.c.war})`);
      }
    }
  });
  L.players=L.players.filter(a=>!a.retired);
  // 성장/노쇠
  L.players.forEach(aiDevelop);
  // FA 이동
  const fas=L.players.filter(a=>a.age>=28&&a.ovr>=62&&R.c(.14));
  fas.forEach(a=>{
    const cands=TEAMS.filter(t=>t.id!==a.team).sort((x,y)=>(y.money+CUL(y.id).fa)-(x.money+CUL(x.id).fa));
    const to=R.c(.6)?cands[R.i(0,2)]:R.pick(cands);
    if(!to)return;
    a.team=to.id;if(!a.teams.includes(to.id))a.teams.push(to.id);
    if(a.ovr>=72)notes.push(`FA — ${a.name}, ${to.name} 이적`);
  });
  // 트레이드
  L.lastTrades=[];
  for(let i=0;i<R.i(2,4);i++){
    const [ta,tb]=R.shuffle(TEAMS).slice(0,2);
    const A=roster(ta.id).filter(a=>a.lv==='1군'),B=roster(tb.id).filter(a=>a.lv==='1군');
    if(A.length<12||B.length<12)continue;
    const needYouth=CUL(ta.id).youth>=4;
    const a1=R.pick(needYouth?A.filter(x=>x.age>=30):A.filter(x=>x.age<=25))||R.pick(A);
    const b1=R.pick(needYouth?B.filter(x=>x.age<=25):B.filter(x=>x.age>=27))||R.pick(B);
    if(!a1||!b1||Math.abs(a1.ovr-b1.ovr)>12)continue;
    a1.team=tb.id;b1.team=ta.id;
    if(!a1.teams.includes(tb.id))a1.teams.push(tb.id);
    if(!b1.teams.includes(ta.id))b1.teams.push(ta.id);
    const line=`${ta.short} ${a1.name} ↔ ${tb.short} ${b1.name}`;
    L.lastTrades.push(line);
    if(a1.ovr>=70||b1.ovr>=70)notes.push('트레이드 — '+line);
  }
  // 신인
  const rk=genRookies(L.year+1,used);
  L.players.push(...rk);
  // 정원 관리 — 넘치면 하위 선수 방출
  TEAMS.forEach(t=>{
    const r=roster(t.id).sort((a,b)=>(b.ovr+b.pot*.3-b.age)-(a.ovr+a.pot*.3-a.age));
    r.slice(30).forEach(a=>{a.retired=true;a.retireYear=L.year;});
  });
  L.players=L.players.filter(a=>!a.retired);
  L.retired=L.retired.filter(a=>a.c.war>=20||a.flagRival).slice(-90);
  L.players.forEach(a=>{if(!a.flagRival&&a.lines.length>18)a.lines=a.lines.slice(-18);});
  const star=rk.sort((a,b)=>b.pot-a.pot)[0];
  if(star&&star.pot>=88)notes.push(`${L.year+1} 신인 — ${star.name} (${TEAM(star.team).short}), 특급 유망주로 평가받는다`);
  SRND=Math.random;
  return notes;
}

function pushHistory(o){L.history.push(o);}
function historicGame(kind,detail){
  const g={y:L.year,kind,detail,who:G.p?G.p.name:''};
  L.games.push(g);
  if(G.p){G.p.gameLog=G.p.gameLog||[];G.p.gameLog.push(g);
    G.p.timeline.push({y:L.year,t:kind});}
  return g;
}
function milestoneCheck(p){
  const out=[];
  const M=[[2000,'통산 2000안타',()=>p.tot.h],[2500,'통산 2500안타',()=>p.tot.h],
    [300,'통산 300홈런',()=>p.tot.hr],[500,'통산 500홈런',()=>p.tot.hr],
    [400,'통산 400도루',()=>p.tot.sb],
    [150,'통산 150승',()=>p.tot.w],[200,'통산 200승',()=>p.tot.w],
    [2000,'통산 2000탈삼진',()=>p.tot.k],[3000,'통산 3000탈삼진',()=>p.tot.k]];
  p.milestones=p.milestones||[];
  M.forEach(([n,label,f])=>{
    const rel=(label.includes('승')||label.includes('탈삼진'))===(p.pos==='pitcher');
    if(!rel)return;
    if(f()>=n&&!p.milestones.includes(label)){
      p.milestones.push(label);p.timeline.push({y:p.year,t:label});
      historicGame(label,`${p.name}, ${label} 달성`);
      out.push(label);
    }
  });
  return out;
}
function leagueLeaderBoard(kind){
  const all=[...L.players,...L.retired].filter(a=>a.c);
  const me={name:G.p.name,c:{hr:G.p.tot.hr,h:G.p.tot.h,w:G.p.tot.w,k:G.p.tot.k,war:G.p.tot.war},me:1};
  const arr=[...all.map(a=>({name:a.name,c:a.c})),me];
  return arr.sort((x,y)=>y.c[kind]-x.c[kind]).slice(0,10);
}
function myRank(kind){
  const all=[...L.players,...L.retired].filter(a=>a.c);
  const v={hr:G.p.tot.hr,h:G.p.tot.h,w:G.p.tot.w,k:G.p.tot.k,war:G.p.tot.war}[kind];
  return all.filter(a=>a.c[kind]>v).length+1;
}

function comboCheck(p){
  p.combos=p.combos||[];
  for(const c of COMBO_EVENTS){
    if(p.combos.includes(c.id))continue;
    if(c.need.every(n=>p.traits.includes(n))){p.combos.push(c.id);return c;}
  }
  return null;
}

   [9] ENGINE — 선수 생성
   ========================================================================== */
const COND_NAME=['최악','나쁨','보통','좋음','최고조'];
const COND_MOD=[-.10,-.05,0,.02,.05];

function createPlayer(name,pos){
  const base=POS[pos].base, st={};
  POS[pos].keys.forEach(k=>st[k]=clamp(Math.round(R.norm(base[k]+2,8)),28,74));
  const o0=ovrOf(pos,st);
  const pot=clamp(Math.round(o0+R.norm(30,11)),o0+10,99);
  const team=R.pick(TEAMS);
  const rnd=pot+o0>=145?1:(pot+o0>=128?2:(pot+o0>=112?3:R.i(4,6)));
  const p={
    name,pos,age:R.i(18,20),year:2026,team:team.id,teamsPlayed:[team.id],draftRound:rnd,
    st,pot,cond:2,fatigue:10,
    traits:[],traitLog:[],
    tend:{diligence:R.i(40,60),competitive:R.i(40,60),leadership:R.i(30,55),selfish:R.i(30,55),
          loyalty:R.i(45,65),star:R.i(30,55),patience:R.i(40,60),aggression:R.i(40,60),social:R.i(40,60)},
    rel:{manager:50,vet:45,team:50,coach:50,rookie:50,front:50,captain:50},
    media:50,nick:'신예',choiceLog:[],gameLog:[],
    flags:[],vet:mkName(),
    rival:mkRival(pos),
    season:null,career:{seasons:[]},
    tot:{g:0,pa:0,h:0,hr:0,rbi:0,sb:0,bb:0,so:0,ab:0,war:0,ip:0,w:0,l:0,sv:0,k:0,er:0},
    awards:{mvp:0,allstar:0,gg:0,hrKing:0,hitKing:0,sbKing:0,winKing:0,soKing:0,eraKing:0,rookie:0,champ:0,ksMvp:0},
    post:{games:0,war:0,bigHits:0,fail:0},
    nat:{caps:0,gold:0,bigMoment:0},
    injuries:[],timeline:[],fanRating:50,fame:0,
    lv:'2군',seasonsPlayed:0,peakAge:20,bestWar:0,trainCount:0,
    gamesTotal:0,seenEvents:[],clutchBonus:0,teamBoost:0,retired:false
  };
  p.timeline.push({y:2026,t:`${TEAM(team.id).name} ${rnd}라운드 지명`});
  return p;
}
function mkRival(myPos){
  const pos=R.c(.5)?myPos:R.pick(['batter','pitcher','catcher']);
  return {name:mkName(),pos,ovr:R.i(50,62),pot:R.i(76,95),war:0,totWar:0,bond:50,
          team:R.pick(TEAMS).id,mvp:0,peak:0};
}

/* ── 능력 종합 ── */
const W_OVR={
  batter:{contact:.25,power:.19,eye:.11,speed:.06,run:.07,defense:.12,throw:.05,mental:.08,stamina:.07},
  pitcher:{velo:.15,stuff:.25,control:.22,breaking:.14,stamina:.10,mental:.05,crisis:.06,recovery:.03},
  catcher:{contact:.17,power:.10,eye:.08,defense:.14,throw:.11,catching:.09,blocking:.08,lead:.13,mental:.06,stamina:.04}
};
function ovrOf(pos,st){let s=0;for(const k in W_OVR[pos])s+=st[k]*W_OVR[pos][k];return Math.round(s);}
function ovr(p){return ovrOf(p.pos,p.st);}

/* ── 특성 효과 합산 ── */
function tEff(p,key){
  let v=0;
  p.traits.forEach(id=>{const t=TR(id);if(t&&t.eff[key]!==undefined)v+=t.eff[key];});
  return v;
}
function ab(p,key){ // 경기용 실효 능력치
  return (p.st[key]||0)+tEff(p,key==='control'?'ctrl':key);
}

/* ── 성향/관계/플래그/성장 ── */
function tend(p,o){for(const k in o)p.tend[k]=clamp((p.tend[k]||50)+o[k],0,100);}
function rel(p,k,v){p.rel[k]=clamp((p.rel[k]||50)+v,0,100);}
function flag(p,f){if(!p.flags.includes(f))p.flags.push(f);}
function grow(p,o){
  for(const k in o){ if(p.st[k]===undefined)continue;
    p.st[k]=clamp(round(p.st[k]+o[k],1),1,100);}
}
function ageCurve(p){
  const a=p.age, late=tEff(p,'lateGrow');
  if(a<=22)return 1.35; if(a<=27)return 1.05; if(a<=30)return .72;
  if(a<=33)return .34+late*.4; return .12+late*.35;
}
function potRoom(p,k){
  const gap=p.pot-p.st[k];
  return clamp(gap/26,-0.2,1.25)*(1+tEff(p,'potential'));
}

/* ── 훈련 ── */
function doTraining(p,t,mult0,fatMul){
  mult0=mult0||1;fatMul=fatMul===undefined?1:fatMul;
  const log=[];
  p.trainCount++;
  const teamDev=(p.pos==='pitcher'?TEAM(p.team).pdev:TEAM(p.team).dev)/10;
  const mult=(1+tEff(p,'train')+teamDev)*ageCurve(p)*(p.cond>=3?1.08:p.cond<=1?.85:1)*mult0;
  if(t.rest){
    const r=1+tEff(p,'rest');
    p.fatigue=clamp(p.fatigue+t.fatigue*r,0,100);
    p.cond=clamp(p.cond+1,0,4);
    log.push('충분히 쉬었다. 몸이 가벼워졌다.');
  }else{
    const changes=[];
    for(const k in t.up){
      if(p.st[k]===undefined)continue;
      let g=t.up[k]*mult;
      if(g>0)g*=clamp(potRoom(p,k),p.st[k]>=p.pot?0:.06,1.25);
      g=round(g*R.f(.75,1.3),1);
      if(Math.abs(g)<0.1)continue;
      p.st[k]=clamp(round(p.st[k]+g,1),1,100);
      changes.push(`${SLABEL[k]} ${g>0?'+':''}${round(g,1)}`);
    }
    p.fatigue=clamp(p.fatigue+t.fatigue*(1+tEff(p,'staminaCost'))*fatMul,0,100);
    if(t.tend)tend(p,t.tend);
    if(t.risk)p.injRisk=(p.injRisk||0)+t.risk*.1;
    log.push(changes.length?changes.join('   '):'큰 변화는 없었다.');
    if(mult<0.5)log.push('예전만큼 몸이 따라오지 않는다.');
  }
  updateCond(p);
  return log;
}
function updateCond(p){
  let c=2;
  if(p.fatigue<20)c=4; else if(p.fatigue<38)c=3; else if(p.fatigue<60)c=2;
  else if(p.fatigue<80)c=1; else c=0;
  c+=Math.round((p.st.mental-50)/40);
  c=clamp(c+ (tEff(p,'condFloor')?0:0),0,4);
  if(tEff(p,'condFloor'))c=Math.max(c,1);
  if(tEff(p,'condCeil'))c=Math.min(c,3);
  p.cond=clamp(c,0,4);
}

/* ==========================================================================
   [10] ENGINE — 출전 등급 / 시즌 시뮬레이션
   ========================================================================== */
function decideLevel(p){
  const o=ovr(p);
  if(p.pos==='pitcher'){
    if(o>=62)return '선발';
    if(o>=52)return '불펜';
    return p.age<=23?'2군':'불펜';
  }
  if(o>=62)return '주전';
  if(o>=52)return '백업';
  return p.age<=23?'2군':'백업';
}
function newSeason(p){
  p.lv=decideLevel(p);
  p.inPost=false;p.missGames=0;p.injRisk=0;p.clutchBonus=0;p.slump=p.slump||0;
  if(L)L.year=p.year;
  if(L)assignRoles();
  const teamStr=(L?teamRating(p.team):62)+R.f(-1.5,1.5)+(p.teamBoost||0)*.6+tEff(p,'teamB')*.5;
  if(p.lv!=='2군'&&!p.debutYear){p.debutYear=p.year;p.timeline.push({y:p.year,t:'1군 데뷔'});}
  p.season={year:p.year,age:p.age,team:p.team,lv:p.lv,
    g:0,pa:0,ab:0,h:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,d2:0,avg:0,ops:0,
    ip:0,w:0,l:0,sv:0,era:0,k:0,er:0,bb9:0,
    war:0,bigHits:0,events:[],traits:[],teamStr};
}
function condMod(p){return COND_MOD[p.cond];}

function simHalf(p,half,bonus,frac,seg){
  frac=frac||.5;
  const s=p.season,log=[];
  const full = p.lv==='주전'||p.lv==='선발' ? 1 : (p.lv==='백업'||p.lv==='불펜' ? .62 : .24);
  const cm=1+condMod(p), clutch=(tEff(p,'clutch')+p.clutchBonus+bonus)*.4;
  const opp=R.f(-2,2);
  if(p.pos==='pitcher'){
    const starts=Math.max(1,Math.round((p.lv==='선발'?30:p.lv==='불펜'?52:12)*frac));
    const perOut=p.lv==='선발'?(4.3+ab(p,'stamina')*.028):(p.lv==='불펜'?1.5:3.4);
    let ip=round(starts*perOut*(1+tEff(p,'ip'))*cm,1);
    ip=round(ip*(1-clamp((p.missGames||0)/144,0,.9)),1);
    const rate=ab(p,'stuff')*.34+ab(p,'control')*.30+ab(p,'velo')*.16+ab(p,'breaking')*.20;
    let era=9.9-rate*.078-tEff(p,'era')-clutch*.02+R.norm(0,.55)+opp*.06-(ab(p,'crisis')-50)*.006;
    era=clamp(round(era*(1-condMod(p)*.6),2),1.30,9.5);
    const k9=clamp((2.5+(ab(p,'velo')-45)*.085+(ab(p,'stuff')-45)*.06+ab(p,'breaking')*.018)*(1+tEff(p,'k9')),3,15);
    const dec=Math.round(starts*(p.lv==='선발'?.68:.26));
    const wr=clamp(.44+(4.70-era)*.075+(s.teamStr-62)*.006+tEff(p,'win')*.4,.18,.80);
    const w=Math.round(dec*wr), l=Math.max(0,dec-w);
    const sv=p.lv==='불펜'?Math.round(starts*R.f(.1,.45)):0;
    s.ip=round(s.ip+ip,1); s.w+=w; s.l+=l; s.sv+=sv;
    s.k+=Math.round(ip/9*k9); s.er+=Math.round(ip/9*era); s.g+=starts;
    log.push(`${half} ${starts}경기 ${ip}이닝  ${w}승 ${l}패  평균자책 ${round(era,2)}  탈삼진 ${Math.round(ip/9*k9)}`);
  }else{
    const catcherF=p.pos==='catcher'?.88:1;
    let gm=Math.round((p.lv==='주전'?144:p.lv==='백업'?88:32)*frac*catcherF);
    gm=Math.max(2,gm-Math.round((p.missGames||0)*frac*2));
    const pa=Math.round(gm*(p.lv==='주전'?4.3:3.6));
    const C=ab(p,'contact')-(p.slump?5:0),P=ab(p,'power'),E=ab(p,'eye');
    let avg=.140+C*.0019+E*.0002+condMod(p)*.12+clutch*.0012+R.norm(0,.021)-opp*.002;
    avg=clamp(avg,.130,.400);
    const bbR=clamp((E/100)*.135*(1+tEff(p,'bb')),.02,.22);
    const soR=clamp(.245-C*.0012+P*.0008+tEff(p,'so'),.06,.36);
    const bb=Math.round(pa*bbR), so=Math.round(pa*soR);
    const abn=Math.max(1,pa-bb-Math.round(pa*.02));
    const h=Math.round(abn*avg);
    const hr=Math.round(pa*Math.pow(P/100,3.2)*.070*cm);
    const d2=Math.round(h*(.15+P*.0009));
    const att=Math.round(Math.pow(ab(p,'run')/100,2)*gm*.6);
    const sb=Math.round(att*(.58+ab(p,'speed')*.003));
    const rbi=Math.round(hr*2.15+h*.33+(s.teamStr-62)*.35+clutch*.5);
    const r=Math.round(h*.42+bb*.24+hr*.4);
    s.g+=gm;s.pa+=pa;s.ab+=abn;s.h+=Math.min(h,abn);s.hr+=hr;s.d2+=d2;
    s.bb+=bb;s.so+=so;s.sb+=Math.max(0,sb);s.rbi+=rbi;s.r+=r;
    log.push(`${half} ${gm}경기  타율 ${avg3(avg)}  ${h}안타 ${hr}홈런 ${rbi}타점 ${sb}도루`);
  }
  const hi=segmentHighlight(p,seg||{m:[4,5]});
  if(hi)log.push(hi);
  p.fatigue=clamp(p.fatigue+(42*full*frac*2)*(1+tEff(p,'staminaCost'))-ab(p,'stamina')*.09,0,100);
  p.gamesTotal+=s.g;
  expGrowth(p,full*frac*2);
  updateCond(p);
  const inj=rollInjury(p,full*frac*2);
  if(inj)log.push(inj);
  if(p.slump)p.slump=0;
  return log;
}
/* 구간별 하이라이트 경기 — 역사적 경기는 리그 기록에도 남는다 */
function segmentHighlight(p,seg){
  if(p.lv==='2군')return null;
  const opp=TEAM(R.pick(TEAMS.filter(t=>t.id!==p.team)).id);
  const date=`${p.year}.${String(R.pick(seg.m)).padStart(2,'0')}.${String(R.i(1,28)).padStart(2,'0')}`;
  p.gameLog=p.gameLog||[];
  if(p.pos==='pitcher'){
    const rate=(ab(p,'stuff')+ab(p,'control')+ab(p,'breaking'))/3;
    if(p.lv==='선발'&&R.c(clamp((rate-74)/300,0,.05))){
      const perfect=R.c(.12);
      const k=perfect?'퍼펙트게임':'노히트노런';
      historicGame(k,`${date} vs ${opp.name} · 9이닝 무실점 ${R.i(7,14)}탈삼진`);
      return `<em>${k}</em> — ${date} ${opp.name}전`;
    }
    if(p.lv==='선발'&&R.c(.35)){
      const ln=`${R.i(6,8)}이닝 ${R.i(0,2)}실점 ${R.i(4,11)}탈삼진`;
      p.gameLog.push({y:p.year,kind:'호투',detail:`${date} vs ${opp.name} · ${ln}`});
    }
    return null;
  }
  const pw=ab(p,'power'),ct=ab(p,'contact');
  if(R.c(clamp((ct+pw-150)/900,0,.035))){
    historicGame('사이클링히트',`${date} vs ${opp.name} · 5타수 4안타`);
    return `<em>사이클링히트</em> — ${date} ${opp.name}전`;
  }
  if(R.c(.4)){
    const h=R.i(2,4),hr=R.c(clamp(pw/260,0,.4))?1:0;
    p.gameLog.push({y:p.year,kind:h>=4?'4안타 경기':'맹타',
      detail:`${date} vs ${opp.name} · ${h+1}타수 ${h}안타 ${hr?'1홈런 ':''}${R.i(1,4)}타점`});
  }
  return null;
}
function expGrowth(p,full){ // 경기 경험 — 잠재력을 향해 서서히 수렴
  const rate=(p.age<=22?.055:p.age<=26?.036:p.age<=29?.016:.004)*full*(1+tEff(p,'potential')*.5+tEff(p,'lateGrow')*.3);
  POS[p.pos].keys.forEach(k=>{
    const g=round((p.pot-p.st[k])*rate*R.f(.4,1.6),1);
    if(g>0.05)p.st[k]=clamp(round(p.st[k]+g,1),1,100);
  });
}
function rollInjury(p,full){
  let c=.055*full*(1+(p.fatigue-40)/110)*(1+tEff(p,'injury'))*(1+(p.injRisk||0));
  c*= p.age>=33?1.5:p.age>=30?1.2:1;
  c*= 1-clamp((p.st.stamina-50)/220,-.2,.25);
  if(!R.c(clamp(c,.01,.6)))return null;
  const sev=R.f(0,1);
  const days=sev>.85?R.i(90,160):sev>.55?R.i(35,70):R.i(10,28);
  const rehab=1-tEff(p,'rehab')*.4;
  const miss=Math.round(days*rehab/1.6);
  p.missGames=(p.missGames||0)+miss;
  p.injuries.push({y:p.year,days});
  p.fatigue=clamp(p.fatigue-15,0,100);
  if(days>=90){
    const k=p.pos==='pitcher'?'velo':'speed';
    p.st[k]=clamp(round(p.st[k]-R.f(1.5,4),1),1,100);
    p.timeline.push({y:p.year,t:'큰 부상 (시즌 아웃)'});
    flag(p,'injuryHistory');
    return `<em>부상</em> — ${days}일 진단. 시즌의 상당 부분을 잃었다.`;
  }
  return `<em>부상</em> — ${days}일 진단. ${miss}경기 결장.`;
}

/* ── 시즌 마감 계산 ── */
function finalizeSeason(p){
  const s=p.season;
  if(p.pos==='pitcher'){
    s.era=s.ip>0?round(s.er*9/s.ip,2):0;
    s.war=round(clamp((s.ip/9)*((5.00-s.era)*.135)+(s.sv*.06),-2,9),1);
  }else{
    s.avg=s.ab>0?s.h/s.ab:0;
    const obp=s.pa>0?(s.h+s.bb)/s.pa:0;
    const tb=s.h+s.d2+2*s.hr;
    const slg=s.ab>0?tb/s.ab:0;
    s.ops=round(obp+slg,3);
    let def=((ab(p,'defense')-58)/100)*1.6*(s.g/144);
    if(p.pos==='catcher')def+=1.2*(s.g/144)+((ab(p,'lead')-55)/100)*1.4;
    s.war=round(clamp((s.g/144)*((s.ops-.660)*15)+def+(s.sb*.012),-2,9),1);
  }
  // 통산 누적
  const t=p.tot;
  t.g+=s.g;t.pa+=s.pa;t.ab+=s.ab;t.h+=s.h;t.hr+=s.hr;t.rbi+=s.rbi;t.sb+=s.sb;
  t.bb+=s.bb;t.so+=s.so;t.ip=round(t.ip+s.ip,1);t.w+=s.w;t.l+=s.l;t.sv+=s.sv;
  t.k+=s.k;t.er+=s.er;t.war=round(t.war+s.war,1);
  if(s.war>p.bestWar){p.bestWar=s.war;p.peakAge=p.age;}
  p.seasonsPlayed++;
  // 라이벌 성장
  simRival(p);
  return s;
}
function simRival(p){
  const rv=p.rival;
  const a=(L.players.find(x=>x.id===rv.id))||(L.retired.find(x=>x.id===rv.id));
  if(!a){rv.war=0;return;}
  rv.war=a.s?a.s.war:0;rv.totWar=a.c.war;rv.team=a.team;rv.ovr=a.ovr;
  rv.retired=a.retired;rv.aw=a.aw;rv.peak=a.peak;
}
function awardsPhase(p){
  const s=p.season,got=[];
  const entry={s,name:p.name,pos:p.pos,team:p.team,rookie:p.year===p.debutYear,ai:0,me:1};
  const lead=leagueAwards(entry);
  const mine=e=>e&&e.me;
  if(p.pos==='pitcher'){
    if(mine(lead.win)){p.awards.winKing++;got.push('다승왕');}
    if(mine(lead.so)){p.awards.soKing++;got.push('탈삼진왕');}
    if(mine(lead.era)){p.awards.eraKing++;got.push('평균자책점 1위');}
  }else{
    if(mine(lead.hr)){p.awards.hrKing++;got.push('홈런왕');}
    if(mine(lead.avg)){p.awards.hitKing++;got.push('타율 1위');}
    if(mine(lead.sb)){p.awards.sbKing++;got.push('도루왕');}
    if(mine(lead.hit))got.push('최다안타');
  }
  if(lead.allstars.some(e=>e.me)){p.awards.allstar++;got.push('올스타');}
  if(lead.gg[p.pos]&&lead.gg[p.pos].me){p.awards.gg++;got.push('골든글러브');}
  if(mine(lead.mvp)){p.awards.mvp++;got.push('정규시즌 MVP');p.fame+=15;p.timeline.push({y:p.year,t:'정규시즌 MVP'});}
  if(mine(lead.rookie)&&p.year===p.debutYear&&p.seasonsPlayed<=2){p.awards.rookie++;got.push('신인왕');p.timeline.push({y:p.year,t:'신인왕'});}
  ['홈런왕','다승왕','도루왕','탈삼진왕','타율 1위'].forEach(g=>{
    if(got.includes(g))p.timeline.push({y:p.year,t:g});});
  updateRecords(lead.ents);
  const nm=e=>e?e.name:'-';
  pushHistory({y:p.year,
    champ:(L.champions.find(c=>c.y===p.year)||{}).team||null,
    mvp:{name:nm(lead.mvp),war:lead.mvp?lead.mvp.s.war:0,me:!!mine(lead.mvp)},
    rookie:nm(lead.rookie),
    hr:{name:nm(lead.hr),v:lead.hr?lead.hr.s.hr:0},
    win:{name:nm(lead.win),v:lead.win?lead.win.s.w:0},
    era:{name:nm(lead.era),v:lead.era?lead.era.s.era:0},
    me:{war:s.war,team:p.team,rank:s.rank}});
  p.fame=clamp(p.fame+s.war*2.2+got.length*3-2,0,100);
  p.fanRating=clamp(p.fanRating+(s.war-2)*1.8+(p.flags.includes('troubleMaker')?-2:0)+tEff(p,'fan'),0,100);
  s.awardsGot=got;
  milestoneCheck(p);
  return got;
}
function rankCheck(p){
  const s=p.season;
  L.year=p.year;
  aiSeasonAll();
  const rows=simStandings(warNow(p));
  const my=rows.find(r=>r.id===p.team);
  s.rank=my.rank;s.teamW=my.w;s.teamL=my.l;
  p.inPost=my.rank<=5;
  const top=rows.slice(0,3).map(r=>`${TEAM(r.id).short} ${r.w}승`).join('  ·  ');
  return p.inPost
    ? [`${TEAM(p.team).name} — 정규시즌 <em>${my.rank}위</em> (${my.w}승 ${my.l}패). 포스트시즌 진출.`,`상위권: ${top}`]
    : [`${TEAM(p.team).name} — 정규시즌 ${my.rank}위 (${my.w}승 ${my.l}패). 가을 야구는 없다.`,`상위권: ${top}`];
}
function warNow(p){ // 시즌 확정 전 임시 WAR 추정
  const s=p.season;
  if(p.pos==='pitcher')return s.ip>0?(s.ip/9)*((5.00-(s.er*9/s.ip))*.135):0;
  const obp=s.pa>0?(s.h+s.bb)/s.pa:0, slg=s.ab>0?(s.h+s.d2+2*s.hr)/s.ab:0;
  return (s.g/144)*((obp+slg-.660)*15);
}
function postseason(p){
  const s=p.season,log=[];
  if(!p.inPost)return [];
  const res=postseasonRun();
  L.champions.push({y:L.year,team:res.champ});
  firstTeam(res.champ).forEach(a=>a.aw.champ++);
  const big=1+tEff(p,'big');
  const perf=clamp((warNow(p)/6)*big*R.f(.4,1.7)+(p.cond-2)*.08+(p.clutchBonus||0)*.05,0,2.2);
  const games=R.i(4,13);
  p.post.games+=games;
  p.post.war=round(p.post.war+round(perf*1.2,1),1);
  if(perf>=1.1){p.post.bigHits+=2;log.push('10월의 그는 다른 선수였다.');}
  else if(perf<=.45){p.post.fail++;log.push('가을에는 방망이가, 공이 무거웠다.');}
  if(res.champ===p.team){
    p.awards.champ++;p.timeline.push({y:p.year,t:'한국시리즈 우승'});
    log.push('<em>한국시리즈 우승.</em> 마운드 위에 모두가 쌓였다.');
    historicGame('한국시리즈 우승',`${TEAM(p.team).name}, ${L.year} 한국시리즈 제패`);
    if(perf>=1.0&&R.c(.6)){p.awards.ksMvp++;p.timeline.push({y:p.year,t:'한국시리즈 MVP'});
      log.push('<em>한국시리즈 MVP</em>에 선정되었다.');p.fame+=12;}
    p.fanRating=clamp(p.fanRating+6,0,100);
  }else{
    log.push(`${TEAM(res.champ).name}이 한국시리즈 우승을 차지했다.`);
  }
  return log;
}
/* ==========================================================================
   [11] ENGINE — 특성 획득 / 진화
   ========================================================================== */
function traitCheck(p){
  const out=[];
  // 진화
  for(const id of [...p.traits]){
    const t=TR(id);
    if(t&&t.evolve&&t.evolve.cond(p)&&!p.traits.includes(t.evolve.to)){
      p.traits[p.traits.indexOf(id)]=t.evolve.to;
      p.traitLog.push({y:p.year,id:t.evolve.to,from:id});
      out.push({type:'evolve',from:id,to:t.evolve.to});
    }
  }
  // 신규 획득
  const cands=TRAITS.filter(t=>!p.traits.includes(t.id)&&t.prob&&
      (t.pos==='all'||t.pos===p.pos)&&!p.traitLog.find(l=>l.id===t.id));
  for(const t of R.shuffle(cands)){
    let pr=0; try{pr=t.prob(p,p.season)||0;}catch(e){pr=0;}
    if(pr>0&&R.c(pr)){ out.push({type:'new',id:t.id}); break; }
  }
  return out;
}
function addTrait(p,id,replaceId){
  if(replaceId){
    p.traits[p.traits.indexOf(replaceId)]=id;
  }else p.traits.push(id);
  p.traitLog.push({y:p.year,id});
  p.season&&p.season.traits.push(id);
}

/* ==========================================================================
   [12] ENGINE — 오프시즌 / 은퇴 / 엔딩
   ========================================================================== */
function agingPhase(p){
  const log=[];
  if(p.age<30)return log;
  const A=1+tEff(p,'aging');
  const rate=(p.age>=36?R.f(2.4,4.2):p.age>=34?R.f(1.6,3.0):p.age>=32?R.f(.9,2.0):R.f(.4,1.2))*A;
  const phys=p.pos==='pitcher'?['velo','stamina','recovery']:['speed','run','stamina','defense'];
  const skill=p.pos==='pitcher'?['control','breaking','stuff','mental','crisis']
                               :['contact','eye','mental','throw','power','catching','blocking','lead'];
  const dropped=[];
  phys.forEach(k=>{ if(p.st[k]===undefined)return;
    const d=round(rate*R.f(.5,1.2),1);
    if(d>.1){p.st[k]=clamp(round(p.st[k]-d,1),1,100);dropped.push(`${SLABEL[k]} -${d}`);}
  });
  skill.forEach(k=>{
    if(p.st[k]===undefined)return;
    if(p.age<=32){ if(R.c(.45))p.st[k]=clamp(round(p.st[k]+R.f(.2,.8),1),1,100); return; }
    const d=round(rate*R.f(.15,.5)*A,1);
    if(d>.1){p.st[k]=clamp(round(p.st[k]-d,1),1,100);dropped.push(`${SLABEL[k]} -${d}`);}
  });
  if(dropped.length)log.push(`몸이 달라졌다 — ${dropped.slice(0,6).join('  ')}`);
  return log;
}
function natCall(p){
  const s=p.season;
  if(s.war<3.6||p.age>34)return null;
  if(!R.c(.55))return null;
  p.nat.caps++;flag(p,'nationalTeam');
  const gold=R.c(.3+ (s.war-3.6)*.05);
  if(gold){p.nat.gold++;p.timeline.push({y:p.year,t:'국제대회 우승'});}
  const big=gold&&R.c(.5);
  if(big)p.nat.bigMoment++;
  p.fame=clamp(p.fame+8,0,100);p.fanRating=clamp(p.fanRating+(gold?7:3),0,100);
  return gold
    ?`국가대표로 <em>국제대회 우승</em>. ${big?'결승전 결승타의 주인공이 그였다.':'대표팀의 중심에 그가 있었다.'}`
    :'국가대표로 발탁되어 국제대회에 출전했다.';
}
function faEligible(p){return p.seasonsPlayed>=8&&!p.faDone;}
function contractValue(p){
  const base=ovr(p)*1.1+p.tot.war*.8+p.fame*.4-(p.age-27)*3-p.injuries.length*2;
  return Math.max(3,Math.round(base/4));
}
function retireCheck(p){
  const o=ovr(p);
  if(p.age>=40)return true;
  if(p.age>=38&&o<64)return true;
  if(p.age>=36&&o<58)return true;
  if(p.age>=34&&o<52)return true;
  if(p.age>=31&&p.season.war<0.2&&p.injuries.length>=3)return true;
  return false;
}
function decideEnding(p){
  for(const e of ENDINGS)if(e.when(p))return e;
  return ENDINGS[ENDINGS.length-1];
}
function careerGrade(p){
  const sc=p.tot.war*1.0+p.awards.mvp*8+p.awards.champ*5+p.awards.ksMvp*5+p.awards.allstar*1.5
    +p.nat.gold*4+p.fanRating*.08;
  if(sc>=110)return 'S+';if(sc>=85)return 'S';if(sc>=65)return 'A';
  if(sc>=45)return 'B';if(sc>=28)return 'C';if(sc>=14)return 'D';return 'F';
}
function seasonGrade(w){return w>=7?'S':w>=5?'A':w>=3.2?'B':w>=1.5?'C':w>=0?'D':'F';}

function startGame(name,pos){
  const seed=Math.floor(Math.random()*900000)+100000;

function setupRival(p){
  const pos=R.c(.5)?p.pos:R.pick(['batter','pitcher','catcher']);
  const t=R.pick(TEAMS.filter(x=>x.id!==p.team));
  seedWorld(L.seed+7);
  const a=genAi(t.id,pos,p.age,2026,'top',new Set(L.players.map(x=>x.name)));
  SRND=Math.random;
  a.pot=clamp(a.pot+12,82,99);a.lv='2군';a.flagRival=true;a.debut=0;a.rookieYear=2026;
  L.players.push(a);
  p.rival={id:a.id,name:a.name,pos,bond:50,war:0,totWar:0,team:t.id,ovr:a.ovr,peak:0,aw:a.aw};
}
function advance(){
  if(G.ui&&G.ui.after){G.ui.after=0;G.pi--;}
  G.pi++;
  if(G.pi>=PHASES.length)G.pi=0;
  const r=runPhase(PHASES[G.pi]);
  if(r==='skip')return advance();
}
function runPhase(ph){
  const p=G.p;
  switch(ph){
  case 'seasonStart':{
    newSeason(p);
    p.nick=nickname(p);
    const cl=competitionCheck(p);
    return scene({when:`${p.year}년 1월 · 동계훈련`,html:seasonCardHtml(p),log:cl,cta:'시즌 시작'});
  }
  case 'train':return trainMenu();
  case 'event':return storyEvent();
  case 'moment1':case 'moment2':case 'moment3':return momentEvent();
  case 'seg1':case 'seg2':case 'seg3':return halfResult(SEGS[ph]);
  case 'teamEvent':return teamEvent();
  case 'combo':{
    const c=comboCheck(p);
    if(!c)return 'skip';
    c.run(p);
    return scene({when:'특성 조합',title:c.title,body:c.text,cta:'계속'});
  }
  case 'trade':return tradePhase();
  case 'leagueOff':{
    const notes=aiOffseason();
    if(!notes.length)return 'skip';
    const cards=notes.slice(0,6).map(t=>({tag:'리그',text:t,y:p.year}));
    if(L)L.news=(L.news||[]).concat(cards).slice(-60);
    return scene({when:`${p.year}년 겨울 · 리그`,title:'리그는 계속 움직인다',
      html:newsHtml(cards),cta:'계속'});
  }
  case 'rank':{
    const log=rankCheck(p);
    const news=genNews(p);
    return scene({when:`${p.year}년 9월 · 정규시즌 종료`,title:'순위가 결정됐다',
      html:newsHtml(news),log,cta:p.inPost?'가을 야구로':'시즌 결산'});
  }
  case 'ksMoment':{
    if(!p.inPost)return 'skip';
    const m=MOMENTS.find(x=>x.id==='M_KS');
    return showMoment(m);
  }
  case 'post':{
    if(!p.inPost)return 'skip';
    const log=postseason(p);
    return scene({when:`${p.year}년 10월 · 포스트시즌`,title:'가을',body:'',log,cta:'시즌 결산'});
  }
  case 'award':{
    finalizeSeason(p);
    const got=awardsPhase(p);
    const agl=agingPhase(p);
    p.nick=nickname(p);
    p.career.seasons.push(JSON.parse(JSON.stringify(p.season)));
    return scene({when:`${p.year}년 11월`,title:`${p.year} 시즌 결산`,
      html:seasonSummaryHtml(p,got,agl),cta:'계속'});
  }
  case 'traits':{
    if(!p.season.traitChecked){p.season.traitChecked=true;G.tq=G.tq.concat(traitCheck(p));}
    if(!G.tq.length)return 'skip';
    const ev=G.tq.shift();
    if(ev.type==='evolve')
      return scene({when:'특성 진화',html:traitRevealHtml(TR(ev.to),ev.from),cta:'계속',after:1});
    const t=TR(ev.id);
    if(p.traits.length<6){
      addTrait(p,ev.id);
      return scene({when:'새로운 특성',html:traitRevealHtml(t),cta:'계속',after:1});
    }
    return scene({when:'새로운 특성',title:'특성 슬롯이 가득 찼다',
      body:`<em>[${t.id}]</em>  (${t.grade})\n${t.desc}\n\n어떤 특성을 대신 내보낼까?`,
      choices:[...p.traits.map(id=>({t:`[${id}] 을(를) 내보낸다`,s:TR(id).desc,
          run:()=>{addTrait(p,ev.id,id);return [`[${id}] 이(가) 커리어 기록으로 남았다.`];}})),
        {t:'새 특성을 받지 않는다',s:'현재 특성을 모두 유지',run:()=>['그는 하던 대로 하기로 했다.']}],
      after:1});
  }
  case 'nat':{
    const r=natCall(p);
    if(!r)return 'skip';
    return scene({when:'국가대표',title:'태극마크',body:'',log:[r],cta:'계속'});
  }
  case 'fa':return faPhase();
  case 'retire':return retirePhase();
  case 'yearEnd':{
    p.age++;p.year++;p.fatigue=clamp(p.fatigue-30,0,100);updateCond(p);
    G.pi=-1;return advance();
  }}
}
/* ── 훈련 ── */
function trainMenu(){
  const p=G.p;
  const when=G.pi<=1?`${p.year}년 2월 · 스프링캠프`:`${p.year}년 7월 · 올스타 휴식기`;
  return scene({when,title:'무엇에 시간을 쓸까',
    body:`시간은 한정되어 있다.\n무엇을 얻으면 무엇을 잃는다.`,
    choices:TRAININGS[p.pos].map(t=>({t:t.name,s:t.sub,run:()=>doTraining(p,t)}))});
}
/* ── 스토리 이벤트 ── */
function storyEvent(){
  const p=G.p;
  const pool=EVENTS.filter(e=>{
    if(e.once&&p.seenEvents.includes(e.id))return false;
    try{return e.when(p);}catch(err){return false;}
  });
  if(!pool.length)return 'skip';
  const bag=[];pool.forEach(e=>{for(let i=0;i<(e.w||5);i++)bag.push(e);});
  const e=R.pick(bag);
  p.seenEvents.push(e.id);
  return scene({when:`${p.year}년`,title:e.title,body:e.text(p),track:1,
    choices:e.choices.map(c=>({t:c.t,s:c.s,risk:c.risk,reveal:c.reveal,outcomes:c.outcomes,
      run:c.run?(()=>c.run(p)):null}))});
}
/* ── 결정적 순간 ── */
function momentEvent(){
  const p=G.p;
  const pool=MOMENTS.filter(m=>m.id!=='M_KS'&&(m.pos==='all'||m.pos===p.pos)&&
    (!m.once||!p.seenEvents.includes(m.id))&&(()=>{try{return m.when(p)}catch(e){return false}})());
  if(!pool.length||R.c(.25))return 'skip';
  return showMoment(R.pick(pool));
}
function showMoment(m){
  const p=G.p;p.seenEvents.push(m.id);
  return scene({when:m.ks?`${p.year}년 10월`:`${p.year}년 · 경기 중`,title:m.title,body:m.text(p),track:1,
    choices:m.choices.map(c=>({t:c.t,run:()=>c.kind?momentResult(p,c.kind,!!m.ks):c.run(p).map(x=>{
      p.clutchBonus+=x.mod||0;return x.msg;})}))});
}
function momentResult(p,kind,isKS){
  const base=p.pos==='pitcher'
    ? (ab(p,'stuff')+ab(p,'control')+ab(p,'crisis')+ab(p,'mental'))/4
    : (ab(p,'contact')+ab(p,'power')*.7+ab(p,'mental')+ab(p,'lead')*0)/2.7;
  let pr=clamp((base-42)/68,.08,.86)+ (tEff(p,'clutch')+p.clutchBonus)*.006+condMod(p);
  let gain=3;
  if(kind==='aggr'){pr-=.10;gain=6;tend(p,{aggression:5,competitive:4});}
  if(kind==='safe'){pr+=.12;gain=1.5;tend(p,{patience:4,selfish:-2});}
  if(kind==='patient'){tend(p,{patience:3});}
  const ok=R.c(clamp(pr,.05,.93));
  const log=[];
  const bat=p.pos!=='pitcher';
  if(ok){
    p.clutchBonus+=gain;p.season.bigHits++;p.fame=clamp(p.fame+(isKS?7:2),0,100);
    p.fanRating=clamp(p.fanRating+(isKS?4:1.5),0,100);
    tend(p,{star:3,competitive:2});
    log.push(bat?(kind==='aggr'?'초구를 그대로 잡아당겼다. 타구는 담장을 넘어갔다.'
                 :kind==='safe'?'깊은 외야 뜬공. 3루 주자가 홈을 밟았다.'
                 :'풀카운트 끝에 중전 적시타.')
              :(kind==='aggr'?'삼진. 그는 마운드를 끝까지 지켰다.'
                 :kind==='safe'?'바뀐 투수가 병살로 이닝을 끝냈다. 판단이 옳았다.'
                 :'한 타자를 잡고 내려왔다. 관중석이 일어섰다.'));
    if(isKS){p.post.bigHits+=2;p.timeline.push({y:p.year,t:'가을의 결정적 장면'});}
    if(kind==='aggr'&&bat&&R.c(.14)&&!p.traits.includes('끝내기 본능'))G.tq.push({type:'new',id:'끝내기 본능'});
    if(kind==='aggr'&&!bat&&R.c(.12)&&!p.traits.includes('위기관리의 달인'))G.tq.push({type:'new',id:'위기관리의 달인'});
  }else{
    p.clutchBonus-=1.5;grow(p,{mental:.6});
    if(isKS)p.post.fail++;
    log.push(bat?(kind==='aggr'?'초구 헛스윙 삼진. 배트가 허공을 갈랐다.'
                 :'끝까지 지켜본 공은 스트라이크였다. 루킹 삼진.')
              :'역전을 허용했다. 더그아웃은 조용했다.');
    log.push('오래 기억에 남을 장면이 되었다.');
  }
  return log;
}
/* ── 반기 결과 ── */
function halfResult(seg){
  const p=G.p;
  const log=simHalf(p,seg.label,p.clutchBonus*.2,seg.frac,seg);
  return scene({when:`${p.year}년 ${seg.label}`,title:'경기는 계속된다',body:'',log,cta:'계속'});
}
/* 구단 전용 이벤트 */
function teamEvent(){
  const p=G.p,cul=CUL(p.team);
  const pool=TEAM_EVENTS.filter(e=>{
    if(p.seenEvents.includes(e.id))return false;
    if(e.team&&e.team!==p.team)return false;
    if(e.cul&&e.cul!==cul.style)return false;
    try{return e.when(p);}catch(err){return false;}
  });
  if(!pool.length||R.c(.2))return 'skip';
  const e=R.pick(pool);p.seenEvents.push(e.id);
  return scene({when:`${p.year}년 · ${TEAM(p.team).name}`,title:e.title,body:e.text(p),track:1,
    choices:e.choices.map(c=>({t:c.t,s:c.s,risk:c.risk,reveal:c.reveal,outcomes:c.outcomes,
      run:c.run?(()=>c.run(p)):null}))});
}
/* 트레이드 제안 */
function tradePhase(){
  const p=G.p;
  if(p.seasonsPlayed<2||p.age>=38)return 'skip';
  const s=p.season, val=ovr(p)+s.war*4+p.fame*.2-(p.age-27)*2;
  const myRank=s.rank||8;
  let chance=.05;
  if(myRank>=7&&val>=78)chance=.13;                 // 하위팀의 좋은 선수 → 매물
  if(myRank<=3&&val<58)chance=.10;                  // 상위팀의 부진한 선수 → 정리
  if(p.flags.includes('wantOut'))chance+=.10;
  if(p.rel.manager<35)chance+=.07;
  if(!R.c(chance))return 'skip';
  const to=R.pick(TEAMS.filter(t=>t.id!==p.team&&(myRank>=7?CUL(t.id).fa>=3:CUL(t.id).youth>=3)));
  const c=CUL(to.id);
  return scene({when:`${p.year}년 12월 · 트레이드`,title:`${to.name}에서 관심을 보이고 있다`,
    body:`${to.name}이 당신을 원한다.\n\n"${c.desc}"\n\n${TEAM(p.team).name}은 결정을 당신에게 맡겼다.`,
    choices:[
      {t:'트레이드를 수용한다',s:'새 팀 · 새 이벤트 · 충성도 ↓',run:()=>{
        const from=TEAM(p.team).name;p.team=to.id;
        if(!p.teamsPlayed.includes(to.id))p.teamsPlayed.push(to.id);
        tend(p,{loyalty:-10});rel(p,'manager',50-p.rel.manager);
        p.timeline.push({y:p.year,t:`${to.name} 트레이드 이적`});
        return[`${from}에서의 시간이 끝났다.`,`${to.name}의 유니폼을 받았다.`];}},
      {t:'거절하고 남는다',s:'충성도 ↑ / 입지 불안',run:()=>{
        tend(p,{loyalty:14});flag(p,'refusedTrade');
        if(R.c(.4)){rel(p,'manager',-12);return['구단은 표정을 감추지 못했다.'];}
        return['그는 남기로 했다.'];}}
    ]});
}
/* ── 시즌 요약 ── */
function seasonSummaryHtml(p,got,agl){
  const s=p.season,pit=p.pos==='pitcher';
  const rows=pit
    ? [['경기',s.g],['이닝',s.ip],['승-패',`${s.w}-${s.l}`],['평균자책',s.era],['탈삼진',s.k],['WAR',s.war]]
    : [['경기',s.g],['타율',s.ab>0?avg3(s.h/s.ab):'-'],['홈런',s.hr],['타점',s.rbi],['도루',s.sb],['WAR',s.war]];
  return `<div class="bigline">${rows.map(([l,v])=>`<div><div class="n">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="center" style="margin:10px 0 4px"><span class="grade">${seasonGrade(s.war)}</span>
      <span class="sm dim"> 시즌 평가</span></div>
    ${got.length?`<div class="center" style="margin:12px 0">${got.map(g=>`<span class="pill" style="color:var(--lamp);border-color:var(--lamp)">${g}</span>`).join('')}</div>`:''}
    ${agl.length?`<div class="log" style="border-color:var(--red)">${agl.map(a=>`<div>${a}</div>`).join('')}</div>`:''}
    <div class="center sm dim" style="margin-top:14px">팬 평가 ${'★'.repeat(clamp(Math.round(p.fanRating/20),0,5))}${'☆'.repeat(5-clamp(Math.round(p.fanRating/20),0,5))}</div>`;
}
/* ── FA ── */
function faPhase(){
  const p=G.p;
  if(!faEligible(p))return 'skip';
  p.faDone=true;
  const v=contractValue(p);
  const others=R.shuffle(TEAMS.filter(t=>t.id!==p.team)).slice(0,2);
  const rich=others.sort((a,b)=>b.money-a.money)[0];
  return scene({when:`${p.year}년 12월 · FA`,title:'자유계약선수',
    body:`${p.seasonsPlayed}시즌을 채웠다. 이제 팀을 고를 수 있다.\n\n현 소속 ${TEAM(p.team).name} — ${v}억 규모 제시\n${rich.name} — ${Math.round(v*R.f(1.15,1.5))}억 규모 제시`,
    choices:[
      {t:`${TEAM(p.team).name}에 남는다`,s:'팀 충성도 ↑↑ 팬 평가 ↑',run:()=>{
        tend(p,{loyalty:18});p.fanRating=clamp(p.fanRating+6,0,100);flag(p,'franchiseStar');
        p.timeline.push({y:p.year,t:'FA 잔류'});return['그는 남기로 했다. 팬들은 그 선택을 오래 기억했다.'];}},
      {t:`${rich.name}으로 이적한다`,s:'조건 ↑↑ 팀 충성도 ↓',run:()=>{
        p.team=rich.id;if(!p.teamsPlayed.includes(rich.id))p.teamsPlayed.push(rich.id);
        tend(p,{loyalty:-14,star:6});p.fanRating=clamp(p.fanRating-4,0,100);
        p.timeline.push({y:p.year,t:`${rich.name} 이적`});return[`${rich.name}의 유니폼을 입는다.`];}},
      {t:'더 좋은 조건을 기다린다',s:'위험 · 보상 모두 큼',run:()=>{
        if(R.c(.45)){const t2=R.pick(TEAMS.filter(t=>t.id!==p.team));p.team=t2.id;
          if(!p.teamsPlayed.includes(t2.id))p.teamsPlayed.push(t2.id);
          p.timeline.push({y:p.year,t:`${t2.name} 이적`});
          return[`늦게까지 기다린 끝에 ${t2.name}과 큰 계약을 맺었다.`];}
        p.fatigue+=10;tend(p,{loyalty:-6});
        return['시장은 차가웠다. 결국 원 소속팀과 낮은 조건에 재계약했다.'];}}
    ]});
}
/* ── 은퇴 ── */
function retirePhase(){
  const p=G.p;
  const forced=retireCheck(p);
  const ask=p.age>=33||p.season.war<0.6&&p.age>=30;
  if(!forced&&!ask)return 'skip';
  if(forced&&p.age>=44)return doRetire('몸이 먼저 대답했다.');
  return scene({when:`${p.year}년 12월`,title:forced?'마지막을 생각할 때':'한 시즌 더?',
    body:forced?`구단에서 연락이 왔다. 내년 계획에 당신의 자리는 없다.\n${p.age}세. 사람들은 이제 그의 이름을 과거형으로 부른다.`
              :`${p.age}세. 아직 할 수 있다는 생각과, 이쯤이면 됐다는 생각이 같이 든다.`,
    choices:forced?[
      {t:'은퇴한다',run:()=>doRetire('그는 스스로 끝을 정했다.')},
      {t:'다른 팀에서 기회를 찾는다',s:'능력치 하락 감수',run:()=>{
        if(R.c(.5)){const t2=R.pick(TEAMS.filter(t=>t.id!==p.team));p.team=t2.id;
          if(!p.teamsPlayed.includes(t2.id))p.teamsPlayed.push(t2.id);
          p.timeline.push({y:p.year,t:`${t2.name} 이적`});return[`${t2.name}이 손을 내밀었다.`];}
        return doRetire('어느 팀도 전화를 걸지 않았다.'),['불러주는 팀은 없었다.'];}}
    ]:[
      {t:'한 시즌 더 뛴다',s:'몸은 정직하다',run:()=>{tend(p,{competitive:6});return['그는 다시 캠프로 향했다.'];}},
      {t:'여기서 은퇴한다',s:'가장 좋은 모습으로',run:()=>doRetire('가장 좋았던 시절의 모습으로 떠나기로 했다.')}
    ]});
}

  scene({when:G.ui.when,title:G.ui.title,body:'',log:log.length?log:['…'],cta:'계속',after:G.ui.after});

  if(s==='create')G.create={name:mkName(),pos:null};

async function save(){
  if(!G.p||G.p.retired)return;
  const u=G.ui||{};
  const resume=(u.choices||u.after)?G.pi:G.pi+1; // 선택 대기 중이면 같은 지점, 결과 화면이면 다음 지점
  await Store.set('save_v1',{p:G.p,resume,tq:G.tq,L});

async function loadGame(){

/* ==========================================================================
   [28] ENGINE v2.1 — 확률 기반 선택지 (outcome)
   choice = { t, s, risk, reveal, outcomes:[{p,label,res,bias}] , run, next, odds }
   res = { st:{power:+2}, tend:{}, rel:{}, flag:'x', fatigue:+10, cond:+1,
           injRisk:.2, fan:+3, media:+5, clutch:+2, text:'...' }
   ========================================================================== */
const REVEAL={FULL:'FULL',PARTIAL:'PARTIAL',HIDDEN:'HIDDEN',RUMOR:'RUMOR'};

function validateOutcomes(c){
  if(!c.outcomes)return;
  const sum=c.outcomes.reduce((s,o)=>s+o.p,0);
  if(Math.abs(sum-1)>0.001)
    console.warn(`[확률 검증] "${c.t}" 선택지의 확률 합이 ${round(sum*100,1)}% 입니다 (100%가 되어야 합니다)`);
}
/* 숨겨진 성향이 확률을 조용히 밀어준다 — 플레이어에게 계산식은 공개하지 않는다 */
function biasedWeights(p,c){
  return c.outcomes.map(o=>{
    let w=o.p;
    if(o.bias)for(const k in o.bias){
      const t=(k==='mental')?p.st.mental:(p.tend[k]!==undefined?p.tend[k]:50);
      w*=clamp(1+((t-50)/100)*o.bias[k]*1.3,.25,2.4);
    }
    return Math.max(.0005,w);
  });
}
function rollOutcome(p,c){
  validateOutcomes(c);
  const w=biasedWeights(p,c), tot=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot,i=0;
  while(i<w.length-1&&r>w[i]){r-=w[i];i++;}
  const o=c.outcomes[i];
  const log=applyResult(p,o.res||{});
  if(o.res&&o.res.text)log.unshift(o.res.text);
  else log.unshift(o.label||'…');
  return log;
}
function applyResult(p,res){
  const log=[];
  if(res.st)grow(p,res.st);
  if(res.tend)tend(p,res.tend);
  if(res.rel)for(const k in res.rel)rel(p,k,res.rel[k]);
  if(res.flag)flag(p,res.flag);
  if(res.fatigue){p.fatigue=clamp(p.fatigue+res.fatigue,0,100);updateCond(p);}
  if(res.cond){p.cond=clamp(p.cond+res.cond,0,4);}
  if(res.injRisk)p.injRisk=(p.injRisk||0)+res.injRisk;
  if(res.fan){p.fanRating=clamp(p.fanRating+res.fan,0,100);}
  if(res.media){p.media=clamp((p.media||50)+res.media,0,100);
    log.push(res.media>0?'언론의 관심이 늘었다.':'언론의 관심에서 조금 멀어졌다.');}
  if(res.clutch)p.clutchBonus=(p.clutchBonus||0)+res.clutch;
  if(res.fame)p.fame=clamp(p.fame+res.fame,0,100);
  return log;
}
/* 선택지 미리보기 — 공개 수준에 따라 다르게 */
function oddsHtml(p,c){
  if(c.odds)  // 훈련처럼 직접 계산한 확률
    return `<div class="odds">${c.odds.map(o=>`<div><b>${o.pct}%</b><span>${esc(o.text)}</span></div>`).join('')}</div>`;
  if(!c.outcomes)return c.s?`<div class="cs">${esc(c.s)}</div>`:'';
  const lv=c.reveal||'PARTIAL';
  if(lv==='HIDDEN')return `<div class="cs">어떤 결과가 기다리는지는 알 수 없다.</div>`;
  const w=biasedWeights(p,c),tot=w.reduce((a,b)=>a+b,0);
  const rows=c.outcomes.map((o,i)=>({label:o.label,pct:Math.round(w[i]/tot*100)}))
                       .sort((a,b)=>b.pct-a.pct);
  if(lv==='FULL')
    return `<div class="odds">${rows.map(r=>`<div><b>${r.pct}%</b><span>${esc(r.label)}</span></div>`).join('')}</div>`;
  if(lv==='RUMOR')
    return `<div class="cs">예상 — ${esc(rows.map(r=>r.label).slice(0,2).join(' / '))}</div>`;
  const top=rows[0];
  const tone=top.pct>=65?'가능성이 높다':top.pct>=45?'해볼 만하다':'장담할 수 없다';
  return `<div class="cs">${esc(top.label)} — ${tone}</div>`;
}
const RISK_LABEL={SAFE:'안전',BALANCED:'보통',RISK:'위험',HIGH_RISK:'무리'};

/* ── 능력치 변화 스냅샷 / 표시 ── */
function snapStats(p){
  const o={__fat:p.fatigue,__cond:p.cond};
  POS[p.pos].keys.forEach(k=>o[k]=p.st[k]);
  return o;
}
function statDiff(p,b){
  const stats=[];
  POS[p.pos].keys.forEach(k=>{
    if(Math.abs(p.st[k]-b[k])>=.05)stats.push({k,from:b[k],to:p.st[k],d:round(p.st[k]-b[k],1)});
  });
  return {stats,fat:Math.round(p.fatigue-b.__fat),cond:p.cond-b.__cond};
}
function diffHtml(d){
  if(!d||(!d.stats.length&&!d.fat&&!d.cond))return '';
  const rows=d.stats.map(s=>{
    const cls=s.d>0?'plus':'minus';
    const lo=Math.min(s.from,s.to),hi=Math.max(s.from,s.to);
    return `<div class="dline ${cls}">
      <span class="nm">${SLABEL[s.k]}</span>
      <span class="from">${Math.round(s.from)}</span><span class="dim">→</span>
      <span class="to">${Math.round(s.to)}</span>
      <span class="delta">${s.d>0?'▲ +':'▼ '}${round(s.d,1)}</span>
      <span class="mini"><i style="width:${lo}%"></i>${s.d>0?`<u style="left:${lo}%;width:${hi-lo}%"></u>`:''}</span>
    </div>`;
  }).join('');
  const extra=[];
  if(d.fat)extra.push(`<div class="dline ${d.fat>0?'minus':'plus'}"><span class="nm">피로도</span>
     <span class="delta">${d.fat>0?'▲ +':'▼ '}${d.fat}</span></div>`);
  if(d.cond)extra.push(`<div class="dline ${d.cond>0?'plus':'minus'}"><span class="nm">컨디션</span>
     <span class="to">${COND_NAME[G.p.cond]}</span></div>`);
  return `<div class="diffbox"><h4>변화</h4>${rows}${extra.join('')}</div>`;
}

   ========================================================================== */
const INTENSITY=[
  {id:'safe',label:'안전하게 조정한다',risk:'SAFE',mult:.7,base:.93,fat:.6},
  {id:'norm',label:'평소대로 훈련한다',risk:'BALANCED',mult:1,base:.76,fat:1},
  {id:'hard',label:'한계를 넘어선다',risk:'HIGH_RISK',mult:1.8,base:.44,fat:1.7,inj:.6}
];
function trainSuccess(p,it){
  let v=it.base+(p.tend.diligence-50)*.0035-(p.fatigue-40)*.0024+tEff(p,'train')*.4
        +(p.cond-2)*.025-(p.age>=33?.06:0);
  return clamp(v,.12,.97);
}
function doTrainingWith(p,t,it){
  if(t.rest)return doTraining(p,t,1,1);
  const pr=trainSuccess(p,it);
  const ok=R.c(pr);
  const log=doTraining(p,t,it.mult*(ok?1:.15),it.fat*(ok?1:1.45));
  if(ok){
    log.unshift(it.id==='hard'?'<em>한계를 넘었다.</em> 몸이 기억할 만한 훈련이었다.':'훈련 성공.');
    if(it.id==='hard')tend(p,{diligence:4,competitive:3});
  }else{
    log.unshift('<em>뜻대로 되지 않았다.</em> 몸이 따라오지 않는다.');
    p.fatigue=clamp(p.fatigue+8,0,100);
    if(it.inj)p.injRisk=(p.injRisk||0)+it.inj*.5;
    tend(p,{patience:2});
  }
  if(it.inj)p.injRisk=(p.injRisk||0)+it.inj*.3;
  updateCond(p);
  return log;
}
/* 몸 상태는 숫자로 다 알려주지 않는다 */
function bodyHint(p){
  const f=p.fatigue;
  if(f>=82)return '몸이 무겁다. 오늘은 무리하면 안 될 것 같다.';
  if(f>=64)return '피로가 쌓여 있는 게 느껴진다.';
  if(f>=42)return '나쁘지 않다. 조금 더 밀어붙일 수 있을 것 같기도 하다.';
  return '몸이 가볍다.';
}

function competitor(p){
  if(!L)return null;
  const same=firstTeam(p.team).filter(a=>a.pos===p.pos);
  return same.sort((a,b)=>b.ovr-a.ovr)[0]||null;
}
function competitionCheck(p){
  const c=competitor(p);
  const log=[];
  if(!c)return log;
  const me=ovr(p);
  if(p.compId!==c.id){p.compId=c.id;p.compYears=0;p.compAhead=me>=c.ovr;}
  p.compYears=(p.compYears||0)+1;
  const ahead=me>=c.ovr;
  if(ahead&&!p.compAhead){
    log.push(`<em>주전 경쟁</em> — ${c.name}(${c.ovr})을 넘어섰다. 이제 감독은 당신을 먼저 부른다.`);
    p.timeline.push({y:p.year,t:`${c.name}과의 주전 경쟁에서 앞서다`});
    rel(p,'manager',6);
  }else if(!ahead&&p.compAhead){
    log.push(`<em>주전 경쟁</em> — ${c.name}(${c.ovr})에게 자리를 내줬다.`);
  }else if(!ahead){
    log.push(`같은 자리를 두고 ${c.name}(종합 ${c.ovr})과 경쟁 중이다. 당신은 ${me}.`);
  }
  p.compAhead=ahead;
  // 팀 내 경쟁자 → 라이벌로 진화
  if(p.compYears>=4&&!p.flags.includes('teamRival_'+c.id)){
    flag(p,'teamRival_'+c.id);
    log.push(`${c.name}과는 이제 단순한 동료가 아니다.`);
  }
  return log;
}

function genNews(p){
  const n=[],add=(tag,text,me)=>n.push({tag,text,me:me?1:0,y:L.year});
  const ones=L.players.filter(a=>a.lv==='1군'&&a.s&&a.s.g);
  const top=ones.slice().sort((a,b)=>b.s.war-a.s.war)[0];
  const hr=ones.filter(a=>a.pos!=='pitcher').sort((a,b)=>b.s.hr-a.s.hr)[0];
  const st=L.standings[0];
  if(st)add('순위',`${TEAM(st.id).name}, ${st.w}승 ${st.l}패로 정규시즌 1위`,st.id===p.team);
  if(top)add('활약',`${top.name}(${TEAM(top.team).short}) 올 시즌 WAR ${top.s.war} — 리그 최고의 한 해`);
  if(hr&&hr.s.hr>=25)add('기록',`${hr.name}, 시즌 ${hr.s.hr}호 홈런`);
  const rookie=ones.filter(a=>a.debut===L.year&&a.s.war>=1.5).sort((a,b)=>b.s.war-a.s.war)[0];
  if(rookie)add('신인',`신인 ${rookie.name}(${TEAM(rookie.team).short}) 데뷔 첫해부터 1군 주전급 활약`);
  const rv=L.players.find(a=>a.id===p.rival.id);
  if(rv&&rv.s&&rv.s.g)add('라이벌',rv.pos==='pitcher'
    ? `${rv.name}, ${rv.s.w}승 평균자책 ${rv.s.era}`
    : `${rv.name}, 타율 ${avg3(rv.s.avg||0)} ${rv.s.hr}홈런`);
  const s=p.season;
  if(s&&s.g)add('당신',p.pos==='pitcher'
    ? `${p.name}, ${s.w}승 ${s.l}패 평균자책 ${s.ip?round(s.er*9/s.ip,2):'-'}`
    : `${p.name}, 타율 ${s.ab?avg3(s.h/s.ab):'-'} ${s.hr}홈런 ${s.rbi}타점`,1);
  // 역사적 사건 (리그 전체)
  if(R.c(.35)){
    const t=R.pick(TEAMS);
    add('구단',R.pick([`${t.name}, 감독 교체 발표`,`${t.name}, 대대적인 리빌딩 선언`,
      `${t.name} 구단주 교체 — 투자 확대 예고`,`${t.name}, 최근 9경기 8승으로 상승세`,
      `${t.name}, 8연패로 흔들리는 중`]),t.id===p.team);
  }
  const dyn=L.champions.slice(-3);
  if(dyn.length===3&&dyn[0].team===dyn[1].team&&dyn[1].team===dyn[2].team)
    add('왕조',`${TEAM(dyn[0].team).name}, 3년 연속 우승 — 새로운 왕조의 시작`,dyn[0].team===p.team);
  L.news=(L.news||[]).concat(n).slice(-60);
  return n;
}

function logChoice(p,title,pick,mark){
  p.choiceLog=p.choiceLog||[];
  p.choiceLog.unshift({y:p.year,title,pick,mark:mark?1:0});
  if(p.choiceLog.length>40)p.choiceLog.pop();
}
function choose(i){
  const c=G.ui.choices[i];
  if(c.next){c.next();return;}
  const p=G.p,before=snapStats(p),fb=p.flags.length;
  const log=(c.outcomes?rollOutcome(p,c):(c.run()||[]));
  if(G.ui.track)logChoice(p,G.ui.title,c.t,p.flags.length>fb);
  if(p.retired)return;
  scene({when:G.ui.when,title:G.ui.title,body:'',log:log.length?log:['…'],
    diff:statDiff(p,before),cta:'계속',after:G.ui.after});
}
/* ── 훈련: 종목 → 강도 (리스크/리턴) ── */
function trainMenu(){
  const p=G.p;
  const when=G.pi<=1?`${p.year}년 2월 · 스프링캠프`:`${p.year}년 7월 · 올스타 휴식기`;
  return scene({when,title:'무엇에 시간을 쓸까',
    body:`시간은 한정되어 있다. 무엇을 얻으면 무엇을 잃는다.\n\n${bodyHint(p)}`,
    choices:TRAININGS[p.pos].map(t=>({t:t.name,s:t.sub,
      next:t.rest?null:()=>intensityMenu(t,when),
      run:t.rest?(()=>doTrainingWith(p,t,INTENSITY[0])):null}))});
}
function intensityMenu(t,when){
  const p=G.p;
  const up=Object.keys(t.up).filter(k=>p.st[k]!==undefined);
  const gain=m=>up.map(k=>`${SLABEL[k]} ${t.up[k]>0?'+':''}${round(t.up[k]*m*ageCurve(p)*(1+tEff(p,'train')),1)}`).join(' ');
  return scene({when,title:`${t.name} — 얼마나 몰아붙일까`,
    body:`${t.sub}\n\n${bodyHint(p)}`,
    choices:INTENSITY.map(it=>{
      const pr=Math.round(trainSuccess(p,it)*100);
      const odds=[{pct:pr,text:`훈련 성공 — 예상 ${gain(it.mult)}`},
                  {pct:100-pr,text:`성장 미미 · 피로 누적${it.inj?' · 부상 위험':''}`}];
      return {t:it.label,risk:it.risk,odds,run:()=>doTrainingWith(p,t,it)};
    }).concat([{t:'돌아간다',risk:'SAFE',s:'다른 훈련을 고른다',next:()=>trainMenu()}])});
}

  if(ss.length<2)return '<div class="sm dim">두 시즌을 마치면 그래프가 그려집니다.</div>';
  const W=320,H=110,pad=18;
  const mx=Math.max(3,...ss.map(s=>s.war)),mn=Math.min(0,...ss.map(s=>s.war));
  const X=i=>pad+(W-pad*2)*(ss.length===1?.5:i/(ss.length-1));
  const Y=v=>H-pad-(H-pad*2)*((v-mn)/(mx-mn||1));
  const pts=ss.map((s,i)=>`${X(i)},${Y(s.war)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="시즌별 WAR 그래프">
    <line class="ax" x1="${pad}" y1="${Y(0)}" x2="${W-pad}" y2="${Y(0)}"/>
    <polyline class="ln" points="${pts}"/>
    ${ss.map((s,i)=>`<circle class="dot" cx="${X(i)}" cy="${Y(s.war)}" r="${s.war===Math.max(...ss.map(x=>x.war))?3.6:2.2}"/>`).join('')}

}

    <div class="quote" style="font-size:14px;margin-top:8px">${esc(rvLine)}</div>
    ${hl.length?`<div class="rule"></div><div class="sm dim" style="margin-bottom:8px">이번 생의 기록</div>
      <div class="tl" style="max-width:440px;margin:0 auto;text-align:left">
      ${hl.map(([k,v,x])=>`<div><b style="min-width:0;color:var(--chalk-dim);font-family:var(--font);font-size:12px;min-width:104px">${esc(k)}</b>
        <span>${esc(v)}${x?` <span class="dim">${esc(x)}</span>`:''}</span></div>`).join('')}</div>`:''}
    <div class="rule"></div>
    <div class="sm dim" style="margin-bottom:8px">커리어 연대기</div>
    <div class="tlx" style="max-width:440px;margin:0 auto;text-align:left">
      ${p.timeline.map(t=>`<div><b>${t.y}</b><span>${esc(t.t)}</span></div>`).join('')}</div>
    ${chronicleHtml(p)}
    <div class="rule"></div>
    <div class="menu"><button onclick="go('hof')">명예의 전당</button><button onclick="go('title')">새로운 선수</button></div>
  </div>`;
}

/* ==========================================================================
   [33] 밸런스 자동 테스트 — 콘솔에서 runBalanceTest(500)
   ========================================================================== */
function runBalanceTest(n){
  n=n||100;
  const t0=Date.now();
  const res={wars:[],seasons:[],inj:[],endings:{},traits:{},mvp:0,allstar:0,hrLead:[],mvpWar:[],
             aiTop:[],roster:[],warnings:0,maxStat:0};
  const w0=console.warn;console.warn=()=>{res.warnings++;};
  for(let i=0;i<n;i++){
    startGame('테스트'+i,['batter','pitcher','catcher'][i%3]);
    let g=0;
    while(G.screen==='game'&&g++<8000){
      if(G.ui&&G.ui.choices)choose(Math.floor(Math.random()*G.ui.choices.length));else advance();
    }
    const p=G.p;
    res.wars.push(p.tot.war);res.seasons.push(p.seasonsPlayed);res.inj.push(p.injuries.length);
    res.mvp+=p.awards.mvp;res.allstar+=p.awards.allstar;
    res.endings[p.ending.title]=(res.endings[p.ending.title]||0)+1;
    p.traits.forEach(t=>res.traits[t]=(res.traits[t]||0)+1);
    POS[p.pos].keys.forEach(k=>res.maxStat=Math.max(res.maxStat,p.st[k]));
    if(L){L.history.forEach(h=>{res.hrLead.push(h.hr.v);res.mvpWar.push(h.mvp.war);});
      res.aiTop.push(L.rec.career.war?L.rec.career.war.v:0);
      res.roster.push(L.players.filter(a=>a.lv==='1군').length);}
  }
  console.warn=w0;
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0;
  const q=(a,f)=>a.slice().sort((x,y)=>x-y)[Math.floor(a.length*f)];
  const top=(o,k)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,k)
    .map(([a,b])=>`${a} ${Math.round(b/n*100)}%`).join(', ');
  console.log(`━━ 밸런스 테스트 ${n}회 (${((Date.now()-t0)/1000).toFixed(1)}초) ━━`);
  console.log(`통산 WAR   25% ${q(res.wars,.25)} / 중앙 ${q(res.wars,.5)} / 75% ${q(res.wars,.75)} / 최대 ${Math.max(...res.wars)}`);
  console.log(`커리어 길이 평균 ${avg(res.seasons)}시즌 · 커리어당 부상 ${avg(res.inj)}회 · 최고 능력치 ${res.maxStat}`);
  console.log(`플레이어 MVP ${res.mvp}회 / 올스타 ${res.allstar}회 (${n}커리어 기준)`);
  console.log(`리그 홈런왕 평균 ${avg(res.hrLead)} · MVP 시즌 WAR 평균 ${avg(res.mvpWar)} · AI 통산 1위 평균 ${avg(res.aiTop)} · 1군 인원 ${avg(res.roster)}`);
  console.log(`엔딩 분포: ${top(res.endings,8)}`);
  console.log(`특성 보유율: ${top(res.traits,8)}`);
  console.log(`확률 합계 경고: ${res.warnings}건`);
  return res;
}
